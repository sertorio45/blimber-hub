          type: string
          format: uuid
          description: UUID do tenant.
        adAccountId:
          type: string
          description: Conta de anúncio opcional (sem prefixo act_).
        level:
          type: string
          enum: [account, campaign, adset, ad]
          default: campaign
        datePreset:
          type: string
          enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, custom]
          default: last_7d
        dateStart:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        dateEnd:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        metrics:
          type: array
          items:
            type: string
          description: Campos Graph opcionais; o padrão inclui spend, clicks e impressions.
        objectId:
          type: string
          description: ID de campanha, conjunto ou anúncio para insights desse nó.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    UpdateCampaignStatusBody:
