    CreateCampaignBody:
      type: object
      required: [tenantId, name, objective, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome da campanha.
        objective:
          type: string
          enum:
            - OUTCOME_AWARENESS
            - OUTCOME_ENGAGEMENT
            - OUTCOME_LEADS
            - OUTCOME_SALES
            - OUTCOME_TRAFFIC
            - OUTCOME_APP_PROMOTION
          description: Objetivos Outcome_* (legados rejeitados).
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (XOR com dailyBudget).
        specialAdCategories:
          type: array
          items:
            type: string
            enum:
              - CREDIT
              - EMPLOYMENT
              - HOUSING
              - ISSUES_ELECTIONS_POLITICS
              - ONLINE_GAMBLING_AND_GAMING
              - FINANCIAL_PRODUCTS_SERVICES
          description: Categorias especiais Meta (vazio = nenhuma).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    CreateAdsetBody:
      type: object
      required:
        - tenantId
        - campaignId
        - name
        - targetingTemplate
        - billingEvent
        - optimizationGoal
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        campaignId:
          type: string
