openapi: 3.0.3
info:
  title: Blimber Meta Ads API
  description: >
    API Meta Ads para Custom GPT Actions no Blimber Hub. Use searchTenants se só
    houver o nome do cliente. Nunca peça access_token. Mutações exigem confirm +
    confirmTenantId; create/edit/delete usam dryRun default true. Bulk delete:
    preview → confirmar IDs → execute. Textos em PT-BR.
  version: 1.7.1
  contact:
    name: Blimber Hub
servers:
  - url: https://app.blimber.com.br
    description: Produção Blimber Hub
security:
  - BearerAuth: []
paths:
  /api/gpt/meta/tenants:
    get:
      operationId: searchTenants
      summary: Buscar cliente (tenant) pelo nome
      description: >
        Busca tenant por nome/slug (match parcial). Use quando o usuário der só
        o nome do cliente e faltar o tenantId (UUID). Se houver vários matches,
        pergunte qual. Retorna id, name, slug — sem tokens. organizationId
        opcional limita ao portfólio.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: >
            Trecho do nome (ou slug) do cliente. Ex.: Farmaestetica.
            (Alias HTTP name também é aceito pelo servidor se q estiver ausente.)
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 2
          description: Alias de q (mesmo efeito). Prefira q.
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Opcional. Se informado, restringe aos tenants ativos vinculados à
            organização/agência em organization_tenants.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de resultados (1–50).
      responses:
        "200":
          description: Lista de tenants (id, name, slug)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSearchResponse"
        "400":
          description: Requisição inválida — q/name ausente ou curto demais
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/tools:
    get:
      operationId: listMetaTools
      summary: Listar tools Meta disponíveis
      description: Catálogo das operações Meta Ads expostas ao GPT (sem secrets).
      responses:
        "200":
          description: Catálogo de tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsCatalogResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/integrations:
    get:
      operationId: listIntegrations
      summary: Status das integrações do tenant
      description: >
        Lista marketing_integrations do tenantId. Confirme meta_ready e
        write_readiness (ads_management + page token). Sem tokens / sem novos OAuth.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Integrações (sem tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ad-accounts:
    get:
      operationId: listAdAccounts
      summary: Listar contas de anúncio Meta
      description: Lista contas de anúncio acessíveis pelo OAuth Meta do tenant.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Contas de anúncio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns:
    get:
      operationId: listCampaigns
      summary: Listar campanhas Meta
      description: Lista campanhas da conta de anúncio do tenant (leitura). Filtre por status se necessário.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de campanhas a retornar (1–200).
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, ARCHIVED, DELETED]
          description: Filtrar por effective_status da campanha.
      responses:
        "200":
          description: Campanhas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createCampaign
      summary: Criar campanha (PAUSED)
      description: >
        Cria campanha Outcome_*. Default status=PAUSED e dryRun=true (preview).
        Exige confirm=true e confirmTenantId=tenantId. ACTIVE exige confirmActive=true.
        Sem budget de campanha envia is_adset_budget_sharing_enabled=false (ABO).
        Erros Graph trazem code/subcode/user_msg e request_payload sanitizado.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "200":
          description: Campanha criada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: >
            Erro de validação ou Graph (details com code/subcode/user_msg e
            request_payload sanitizado em META_GRAPH_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorToolResponse"

  /api/gpt/meta/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      summary: Detalhe de uma campanha
      description: Obtém o detalhe da campanha e valida se ela pertence à conta de anúncio do tenant.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns/{campaignId}/status:
    post:
      operationId: updateCampaignStatus
      summary: Pausar ou ativar campanha
      description: >
        ACTIVE ou PAUSED. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false nesta ação legada) retorna preview sem POST.
      x-openai-isConsequential: true
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignStatusBody"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets:
    get:
      operationId: listAdsets
      summary: Listar conjuntos de anúncios (adsets)
      description: Lista conjuntos de anúncios da conta ou filtrados por campanha.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar conjuntos de anúncios desta campanha.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de conjuntos de anúncios (1–200).
      responses:
        "200":
          description: Conjuntos de anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAdset
      summary: Criar adset (PAUSED)
      description: >
        Cria adset com targetingTemplate fechado (BR_*). Default PAUSED + dryRun=true.
        Exige confirm+confirmTenantId, budget e campaignId da conta do tenant.
        ACTIVE exige confirmActive. Sem Advantage+/catálogo.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdsetBody"
      responses:
        "200":
          description: Adset criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/status:
    post:
      operationId: updateAdsetStatus
      summary: Pausar ou ativar adset
      description: >
        ACTIVE ou PAUSED no adset. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do conjunto de anúncios (adset) na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetStatusBody"
      responses:
        "200":
          description: Status do adset atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/budget:
    post:
      operationId: updateAdsetBudget
      summary: Atualizar budget do adset
      description: >
        dailyBudget ou lifetimeBudget (centavos). dryRun default true. Teto META_GPT_BUDGET_*.
        Aumento % alto exige confirmBudgetIncrease. confirm + confirmTenantId obrigatórios.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetBudgetBody"
      responses:
        "200":
          description: Budget atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/targeting:
    post:
      operationId: updateAdsetTargeting
      summary: Atualizar targeting do adset
      description: >
        Só templates BR_*. dryRun default true. Sem targeting Graph livre. confirm + confirmTenantId.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetTargetingBody"
      responses:
        "200":
          description: Targeting atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads:
    get:
      operationId: listAds
      summary: Listar anúncios
      description: Lista anúncios da conta, campanha ou adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar por campanha.
        - name: adsetId
          in: query
          schema:
            type: string
          description: Filtrar por conjunto de anúncios (adset).
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Se true, retorna só anúncios ativos.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de anúncios (1–200).
      responses:
        "200":
          description: Anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAd
      summary: Criar anúncio + criativo link/page
      description: >
        Cria AdCreative (object_story_spec com page_id) + Ad no adsetId do tenant.
        Default PAUSED + dryRun=true. Exige confirm+confirmTenantId, page_id/page token.
        imageUrl|imageHash opcional (HTTPS; nunca inventar). Sem geração de imagem.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "200":
          description: Anúncio criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/status:
    post:
      operationId: updateAdStatus
      summary: Pausar ou ativar anúncio
      description: >
        ACTIVE ou PAUSED no anúncio. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdStatusBody"
      responses:
        "200":
          description: Status do anúncio atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/creative-copy:
    post:
      operationId: updateAdCreativeCopy
      summary: Atualizar copy do anúncio
      description: >
        Novo AdCreative + swap (message/headline/description/CTA/link). dryRun default true.
        Exige Page. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdCreativeCopyBody"
      responses:
        "200":
          description: Copy atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/media:
    post:
      operationId: updateAdMedia
      summary: Atualizar mídia do anúncio
      description: >
        imageUrl ou imageHash via novo AdCreative + swap; preserva copy. dryRun default true.
        Sem video/upload. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdMediaBody"
      responses:
        "200":
          description: Mídia atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/preview:
    post:
      operationId: previewBulkDelete
      summary: Preview exclusão em massa (IDs explícitos)
      description: >
        Valida ownership dos IDs (level campaign|adset|ad), retorna tabela
        nome/status/budget e previewToken (TTL). Sem POST na Graph.
        NUNCA apague por nome — só IDs explícitos (máx. META_GPT_BULK_MAX).
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewBulkDeleteBody"
      responses:
        "200":
          description: Preview + previewToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/execute:
    post:
      operationId: executeBulkDelete
      summary: Executar exclusão em massa (após preview)
      description: >
        Exige previewToken recente + confirm + confirmTenantId + confirmDelete=true
        + dryRun=false. Processa sequencialmente (succeeded/failed).
        Default dryRun=true (sem mutação). Preferir deleteMode=DELETED.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteBulkDeleteBody"
      responses:
        "200":
          description: Resultado parcial ou total da exclusão / dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/insights:
    post:
      operationId: getInsights
      summary: Consultar insights Meta
      description: >
        Métricas (impressions, spend, CTR, etc.) por nível account|campaign|adset|ad
        e período (datePreset ou custom). Sempre informe tenantId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsBody"
      responses:
        "200":
          description: Métricas (insights)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/invoke:
    post:
      operationId: invokeMetaTool
      summary: Invocação genérica (alternativa)
      description: >
        Invoca uma tool pelo nome (alternativa tipada). Prefira as rotas REST acima no Custom GPT.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeBody"
      responses:
        "200":
          description: Resultado da tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        No GPT → Autenticação → Chave de API → Bearer.
        Cole o valor de BLIMBER_MCP_API_KEY (sem digitar o prefixo Bearer no campo do ChatGPT).

  schemas:
    TenantSearchResponse:
      type: object
      required: [ok, query, tenants]
      properties:
        ok:
          type: boolean
          example: true
        query:
          type: string
          description: Texto de busca normalizado usado na consulta.
        organizationId:
          type: string
          format: uuid
          description: Presente quando a busca foi limitada a uma organização.
        tenants:
          type: array
          items:
            type: object
            required: [id, name, slug]
            properties:
              id:
                type: string
                format: uuid
                description: UUID do tenant — use como tenantId nas outras ações.
              name:
                type: string
                description: Nome do cliente/empresa.
              slug:
                type: string
                description: Slug público do tenant.
    OkToolResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tool:
          type: string
        data:
          type: object
          description: Payload tipado da tool (estrutura varia por operação).
    ErrorToolResponse:
      type: object
      description: >
        Erro tipado. Em META_GRAPH_ERROR, details inclui code, error_subcode,
        error_user_title, error_user_msg, fbtrace_id e request_payload (sem tokens).
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            details:
              type: object
              description: Campos Graph + request_payload sanitizado em writes.
    ToolsCatalogResponse:
      type: object
