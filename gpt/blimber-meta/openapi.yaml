          type: string
          minLength: 1
          maxLength: 400
          description: Nome do adset.
        targetingTemplate:
          type: string
          enum: [BR_18_65, BR_25_54, BR_18_34, BR_35_65]
          description: Template fechado geo+idade (sem targeting Graph livre).
        billingEvent:
          type: string
          enum: [IMPRESSIONS, LINK_CLICKS]
          description: Evento de cobrança whitelisted.
        optimizationGoal:
          type: string
          enum:
            - REACH
            - IMPRESSIONS
            - LINK_CLICKS
            - LANDING_PAGE_VIEWS
            - OFFSITE_CONVERSIONS
            - LEAD_GENERATION
            - QUALITY_LEAD
            - CONVERSATIONS
            - THRUPLAY
            - POST_ENGAGEMENT
          description: Meta de otimização whitelisted.
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (exige endTime).
        startTime:
          type: string
          description: Início ISO-8601 opcional.
        endTime:
          type: string
          description: Fim ISO-8601 (obrigatório com lifetimeBudget).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
