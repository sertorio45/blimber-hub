openapi: 3.0.3
info:
  title: Blimber Meta Ads API
  description: >
    API HTTP para Custom GPT Actions no ChatGPT. Gerencia Meta Ads do Blimber Hub
    via marketing_integrations (OAuth já conectado). Se o usuário der só o nome do
    cliente, use searchTenants para obter o tenantId; depois use tenantId nas
    demais ações. Nunca peça ou exponha access_token. Mutações exigem confirm +
    confirmTenantId. Respostas e textos de ajuda desta API estão em português (Brasil).
  version: 1.1.0
  contact:
    name: Blimber Hub
servers:
  - url: https://app.blimber.com.br
    description: Produção Blimber Hub
security:
  - BearerAuth: []
paths:
  /api/gpt/meta/tenants:
    get:
      operationId: searchTenants
      summary: Buscar cliente (tenant) pelo nome
      description: >
        Busca administrativa por nome/slug do tenant (ilike, match parcial).
        Use quando o usuário informar só o nome do cliente (ex.: Farmaestetica)
        e ainda não tiver o tenantId (UUID). Se houver vários matches, pergunte
        qual. Só campos públicos (id, name, slug) — nunca tokens Meta.
        A API key Bearer é global de serviço; com organizationId opcional, limita
        ao portfólio em organization_tenants.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: >
            Trecho do nome (ou slug) do cliente. Ex.: Farmaestetica.
            (Alias HTTP name também é aceito pelo servidor se q estiver ausente.)
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 2
          description: Alias de q (mesmo efeito). Prefira q.
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: >
            Opcional. Se informado, restringe aos tenants ativos vinculados à
            organização/agência em organization_tenants.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de resultados (1–50).
      responses:
        "200":
          description: Lista de tenants (id, name, slug)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSearchResponse"
        "400":
          description: Requisição inválida — q/name ausente ou curto demais
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/tools:
    get:
      operationId: listMetaTools
      summary: Listar tools Meta disponíveis
      description: Catálogo das operações Meta Ads expostas ao GPT (sem secrets).
      responses:
        "200":
          description: Catálogo de tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsCatalogResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/integrations:
    get:
      operationId: listIntegrations
      summary: Status das integrações do tenant
      description: >
        Lista marketing_integrations (Meta/Google/etc.) do tenantId. Use primeiro
        para confirmar meta conectado. Não retorna tokens.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Integrações (sem tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ad-accounts:
    get:
      operationId: listAdAccounts
      summary: Listar contas de anúncio Meta
      description: Lista contas de anúncio acessíveis pelo OAuth Meta do tenant.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Contas de anúncio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns:
    get:
      operationId: listCampaigns
      summary: Listar campanhas Meta
      description: Lista campanhas da conta de anúncio do tenant (leitura). Filtre por status se necessário.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de campanhas a retornar (1–200).
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, ARCHIVED, DELETED]
          description: Filtrar por effective_status da campanha.
      responses:
        "200":
          description: Campanhas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      summary: Detalhe de uma campanha
      description: Obtém o detalhe da campanha e valida se ela pertence à conta de anúncio do tenant.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns/{campaignId}/status:
    post:
      operationId: updateCampaignStatus
      summary: Pausar ou ativar campanha
      description: >
        Muda status para ACTIVE ou PAUSED. Exige confirm=true e confirmTenantId
        idêntico a tenantId. Sempre confirme com o usuário antes de chamar.
      x-openai-isConsequential: true
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignStatusBody"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets:
    get:
      operationId: listAdsets
      summary: Listar conjuntos de anúncios (adsets)
      description: Lista conjuntos de anúncios da conta ou filtrados por campanha.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar conjuntos de anúncios desta campanha.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de conjuntos de anúncios (1–200).
      responses:
        "200":
          description: Conjuntos de anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads:
    get:
      operationId: listAds
      summary: Listar anúncios
      description: Lista anúncios da conta, campanha ou adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar por campanha.
        - name: adsetId
          in: query
          schema:
            type: string
          description: Filtrar por conjunto de anúncios (adset).
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Se true, retorna só anúncios ativos.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de anúncios (1–200).
      responses:
        "200":
          description: Anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/insights:
    post:
      operationId: getInsights
      summary: Consultar insights Meta
      description: >
        Métricas (impressions, spend, CTR, etc.) por nível account|campaign|adset|ad
        e período (datePreset ou custom). Sempre informe tenantId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsBody"
      responses:
        "200":
          description: Métricas (insights)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/invoke:
    post:
      operationId: invokeMetaTool
      summary: Invocação genérica (alternativa)
      description: >
        Invoca uma tool pelo nome (alternativa tipada). Prefira as rotas REST acima no Custom GPT.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeBody"
      responses:
        "200":
          description: Resultado da tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        No GPT → Autenticação → Chave de API → Bearer.
        Cole o valor de BLIMBER_MCP_API_KEY (sem digitar o prefixo Bearer no campo do ChatGPT).

  schemas:
    TenantSearchResponse:
      type: object
      required: [ok, query, tenants]
      properties:
        ok:
          type: boolean
          example: true
        query:
          type: string
          description: Texto de busca normalizado usado na consulta.
        organizationId:
          type: string
          format: uuid
          description: Presente quando a busca foi limitada a uma organização.
        tenants:
          type: array
          items:
            type: object
            required: [id, name, slug]
            properties:
              id:
                type: string
                format: uuid
                description: UUID do tenant — use como tenantId nas outras ações.
              name:
                type: string
                description: Nome do cliente/empresa.
              slug:
                type: string
                description: Slug público do tenant.
    OkToolResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tool:
          type: string
        data:
          type: object
          additionalProperties: true
    ToolsCatalogResponse:
      type: object
      properties:
        server:
          type: string
        version:
          type: string
        primary:
          type: string
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              arguments:
                type: array
                items:
                  type: string
    InsightsBody:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: UUID do tenant.
        adAccountId:
          type: string
          description: Conta de anúncio opcional (sem prefixo act_).
        level:
          type: string
          enum: [account, campaign, adset, ad]
          default: campaign
        datePreset:
          type: string
          enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, custom]
          default: last_7d
        dateStart:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        dateEnd:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        metrics:
          type: array
          items:
            type: string
          description: Campos Graph opcionais; o padrão inclui spend, clicks e impressions.
        objectId:
          type: string
          description: ID de campanha, conjunto ou anúncio para insights desse nó.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    UpdateCampaignStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
    InvokeBody:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          type: string
          enum:
            - meta_list_integrations
            - meta_list_ad_accounts
            - meta_list_campaigns
            - meta_get_campaign
            - meta_list_adsets
            - meta_list_ads
            - meta_get_insights
            - meta_update_campaign_status
        arguments:
          type: object
          additionalProperties: true
          description: Payload da tool (sempre com tenantId).
