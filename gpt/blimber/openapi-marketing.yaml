openapi: 3.1.1
info:
  title: Blimber Marketing API
  description: >
    Ação 1 (Marketing + platform + brand). Auth Bearer BLIMBER_MCP_API_KEY.
    Ads pagos: Ação 2 (openapi-ads.yaml, host ads.blimber.com.br). Não importe
    o índice openapi.yaml no mesmo GPT.
  version: 0.5.0
  contact:
    name: Blimber Hub
servers:
  - url: https://app.blimber.com.br
    description: Produção Blimber Hub (Ação Marketing)
security:
  - BearerAuth: []
paths:
  /api/gpt/tenants:
    get:
      operationId: searchTenants
      summary: Buscar cliente (tenant) pelo nome
      description: >
        Busca tenant por nome/slug. Use quando faltar tenantId UUID. Vários
        matches → confirme qual. Retorna id, name, slug — sem tokens.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Trecho do nome ou slug do cliente.
        - name: name
          in: query
          required: false
          schema:
            type: string
            minLength: 2
          description: Alias de q. Prefira q.
        - name: organizationId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Opcional. Limita ao portfólio da organização.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Máximo de resultados (1–50).
      responses:
        "200":
          description: Lista de tenants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSearchResponse"
        "400":
          description: q/name inválido
        "401":
          description: Não autorizado
        "503":
          description: BLIMBER_MCP_API_KEY ausente

  /api/gpt/clients:
    get:
      operationId: listClients
      summary: Listar clientes, módulos e integrações
      description: >
        Inventário paginado para automações n8n. Retorna módulos ativos e
        estado das integrações, sem tokens. Continue com nextCursor até null.
        connected/ready são baseados na configuração salva, não em teste ao vivo.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
        - name: includeInactive
          in: query
          schema: { type: boolean, default: false }
        - name: module
          in: query
          schema: { type: string, enum: [crm, cms, article, marketing, whatsapp] }
        - name: integrationProvider
          in: query
          schema: { type: string, enum: [meta, google_ads, google_analytics, linkedin, whatsapp] }
        - name: integrationStatus
          in: query
          schema: { type: string, enum: [active, ready, missing] }
      responses:
        "200":
          description: Página de clientes com nextCursor
        "401":
          description: Não autorizado

  /api/gpt/tools:
    get:
      operationId: listBlimberTools
      summary: Catálogo unificado de tools
      description: >
        Lista tools por domínio (platform, marketing, ads.meta). Sem secrets.
        Ops Meta (list/create/status/bulk) estão na Ação Ads (ads.blimber.com.br).
      responses:
        "200":
          description: Catálogo
        "401":
          description: Não autorizado

  /api/gpt/marketing/accounts:
    get:
      operationId: listSocialAccounts
      summary: Listar contas sociais
      description: Contas sociais ativas do tenant (para accountId em createPost).
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
      responses:
        "200":
          description: Contas sociais
        "401":
          description: Não autorizado

  /api/gpt/marketing/assets:
    get:
      operationId: listMediaAssets
      summary: Listar biblioteca de mídia
      description: >
        Lista media_assets do tenant. IDs de purpose=publication vão em
        createPost.assetIds (publicar). purpose=reference em referenceAssetIds.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Limite de itens.
        - name: search
          in: query
          schema:
            type: string
          description: Busca por nome.
        - name: purpose
          in: query
          schema:
            type: string
            enum: [reference, publication]
          description: Filtro de purpose.
        - name: mime
          in: query
          schema:
            type: string
            maxLength: 80
          description: Prefixo de mime_type (ex. image).
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrar assets da campanha editorial.
      responses:
        "200":
          description: Assets
        "401":
          description: Não autorizado

  /api/gpt/marketing/assets/upload:
    post:
      operationId: uploadMediaAsset
      summary: Enviar mídia para a biblioteca
      description: >
        Upload na biblioteca (mesmo storage/compressão do Hub). Prefira
        sourceUrl HTTPS. sourceUrl XOR sourceBase64. dryRun default true.
        Exige confirm + confirmTenantId. Imagem jpeg/png/webp/gif; vídeo
        mp4/mov. URL até 100MB; base64 ~8MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                sourceUrl:
                  type: string
                  format: uri
                  description: URL HTTPS pública da imagem/vídeo (preferencial).
                sourceBase64:
                  type: string
                  description: Base64 ou data URL (máx ~8MB). XOR sourceUrl.
                name:
                  type: string
                  maxLength: 255
                mimeType:
                  type: string
                  maxLength: 150
                purpose:
                  type: string
                  enum: [reference, publication]
                  default: publication
                category:
                  type: string
                  enum: [logo, brand_manual, photo, video, product, document, reference]
                formatHint:
                  type: string
                  enum: [auto, square, portrait, landscape, story]
                  default: auto
                campaignId:
                  type: string
                  format: uuid
                dryRun:
                  type: boolean
                  default: true
                actorUserId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Preview ou asset criado (id, mime, dimensões, previewUrl)
        "401":
          description: Não autorizado
        "413":
          description: Arquivo grande demais

  /api/gpt/marketing/assets/{assetId}/delete:
    post:
      operationId: deleteMediaAsset
      summary: Excluir mídia da biblioteca
      description: >
        Remove 1 media_asset (storage + DB). dryRun default true (preview com
        linkedPosts). Bloqueia com ASSET_IN_USE se vinculada a posts. Exige
        confirm + confirmTenantId. Use POST (não DELETE): ChatGPT Actions
        remove body de DELETE.
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da mídia (um por chamada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
                  description: >
                    true = preview (nome, tamanho, linkedPosts). false = excluir
                    após confirmação.
                actorUserId:
                  type: string
                  format: uuid
                  description: Opcional. Reservado para auditoria futura.
      responses:
        "200":
          description: Preview ou mídia excluída
        "401":
          description: Não autorizado
        "403":
          description: Mídia de outro tenant
        "404":
          description: Mídia não encontrada
        "409":
          description: Mídia vinculada a publicações (ASSET_IN_USE)

  /api/gpt/marketing/brand-context:
    get:
      operationId: getBrandContext
      summary: Brand Context do tenant
      description: Tom, CTAs, restrições e identidade do Brand Center.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
      responses:
        "200":
          description: BrandContext
        "401":
          description: Não autorizado
    put:
      operationId: updateBrandContext
      summary: Atualizar Brand Center
      description: >
        Atualiza tom/CTAs/restrições (social_brand_guides). dryRun default
        true. Exige confirm + confirmTenantId. Superadmin sem membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                toneOfVoice:
                  type: string
                  maxLength: 5000
                audience:
                  type: string
                  maxLength: 5000
                allowedWords:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 80
                forbiddenWords:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 80
                ctas:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    maxLength: 200
                hashtags:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 80
                restrictions:
                  type: string
                  maxLength: 5000
                legalNotes:
                  type: string
                  maxLength: 5000
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou marca atualizada
        "401":
          description: Não autorizado

  /api/gpt/marketing/posts:
    get:
      operationId: listPosts
      summary: Listar posts editoriais
      description: Lista social_posts do tenant (rascunhos, agenda, status).
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página.
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Tamanho da página.
        - name: status
          in: query
          schema:
            type: string
          description: Filtro de status do post.
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrar por campanha editorial.
        - name: search
          in: query
          schema:
            type: string
          description: Busca no título.
      responses:
        "200":
          description: Posts + pagination
        "401":
          description: Não autorizado
    post:
      operationId: createPost
      summary: Criar post editorial (draft)
      description: >
        Cria rascunho em social_posts. dryRun default true (preview, sem actor).
        confirm + confirmTenantId. Execute exige actor. Mídia: assetIds da
        biblioteca e/ou sourceUrls/sourceBase64 no mesmo call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, title, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 2
                  maxLength: 180
                content:
                  type: string
                  maxLength: 10000
                artText:
                  type: string
                  maxLength: 2000
                  description: Texto da arte (metadata).
                cta:
                  type: string
                  maxLength: 240
                  description: CTA do post (metadata).
                campaignId:
                  type: string
                  format: uuid
                hashtags:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 100
                scheduledAt:
                  type: string
                  format: date-time
                  description: >
                    ISO-8601 com offset. Só grava a data no rascunho (não
                    enfileira). Depois de aprovado use schedulePost.
                    Ex.: 2026-08-17T19:00:00-03:00 (America/Sao_Paulo).
                timezone:
                  type: string
                  maxLength: 80
                  default: America/Sao_Paulo
                assetIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                  description: >
                    IDs da biblioteca (purpose=publication). Anexa ao canal.
                    Exige accountId+platform. Combine com sourceUrls se quiser.
                referenceAssetIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                  description: IDs purpose=reference (moodboard). Não são publicados.
                sourceUrls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                  description: >
                    HTTPS públicos. Upload + anexa neste call (pipeline da
                    biblioteca). Ordem: assetIds, sourceUrls, sourceBase64.
                    dryRun só lista, não grava.
                sourceBase64:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                  description: Base64 (máx ~8MB cada). Prefira sourceUrls.
                accountId:
                  type: string
                  format: uuid
                platform:
                  type: string
                  enum: [facebook, instagram, linkedin]
                format:
                  type: string
                  enum: [static, carousel, video, story]
                  default: static
                  description: Formato da variant (exige accountId+platform).
                caption:
                  type: string
                  maxLength: 5000
                  description: Caption da variant. Default = content.
                actorUserId:
                  type: string
                  format: uuid
                  description: UUID de auth.users (created_by). Só exigido em dryRun=false se o servidor não tiver BLIMBER_MCP_ACTOR_USER_ID. Preview não exige.
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou post criado
        "401":
          description: Não autorizado

  /api/gpt/marketing/posts/{postId}:
    get:
      operationId: getPost
      summary: Detalhe do post
      description: Detalhe de um post editorial por postId.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      responses:
        "200":
          description: Post
        "401":
          description: Não autorizado
    put:
      operationId: updatePost
      summary: Atualizar post draft
      description: >
        Atualiza copy/mídia e/ou editorialStatus. scheduledAt ou
        publicationStatus scheduled/published/not_scheduled enfileira de
        verdade (enqueueApprovedPost). dryRun default true.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 2
                  maxLength: 180
                content:
                  type: string
                  maxLength: 10000
                artText:
                  type: string
                  maxLength: 2000
                  description: Texto da arte (metadata).
                cta:
                  type: string
                  maxLength: 240
                  description: CTA do post (metadata).
                hashtags:
                  type: array
                  maxItems: 30
                  items:
                    type: string
                    maxLength: 100
                campaignId:
                  type: string
                  format: uuid
                scheduledAt:
                  type: string
                  format: date-time
                  description: >
                    ISO com offset (America/Sao_Paulo). Enfileira publication_jobs,
                    não só grava a data. Exige aprovado. Ex.: 2026-08-17T19:00:00-03:00.
                timezone:
                  type: string
                  maxLength: 80
                publicationStatus:
                  type: string
                  enum: [scheduled, published, not_scheduled]
                  description: >
                    scheduled=agendar, published=publicar agora,
                    not_scheduled=cancelar agenda. Mesmo domínio do Hub.
                variants:
                  type: array
                  maxItems: 10
                  description: >
                    Social channels to assign. Replaces ALL existing variants.
                    Each item needs accountId (from listSocialAccounts) + platform.
                    Send empty array [] to remove all variants.
                  items:
                    type: object
                    required: [accountId, platform]
                    properties:
                      accountId:
                        type: string
                        format: uuid
                        description: UUID of the social account (from listSocialAccounts).
                      platform:
                        type: string
                        enum: [facebook, instagram, linkedin]
                      format:
                        type: string
                        enum: [static, carousel, video, story]
                        default: static
                      caption:
                        type: string
                        maxLength: 5000
                        description: Per-channel caption. Defaults to post content.
                      assetIds:
                        type: array
                        maxItems: 20
                        items:
                          type: string
                          format: uuid
                        description: >
                          IDs purpose=publication da biblioteca para este canal.
                sourceUrls:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                    maxLength: 2048
                  description: >
                    Upload HTTPS neste call; entra em variants[0] depois de assetIds.
                    Exige variants[]. Mesmos limites SSRF do uploadMediaAsset.
                sourceBase64:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    minLength: 8
                    maxLength: 12000000
                  description: >
                    Upload base64 neste call (~8MB); anexa após sourceUrls no 1º canal.
                referenceAssetIds:
                  type: array
                  maxItems: 20
                  items:
                    type: string
                    format: uuid
                  description: >
                    Substitui referências do post (variant_id nulo). Omita para
                    não alterar. Array vazio remove as referências.
                editorialStatus:
                  type: string
                  enum: [draft, approved, changes_requested, rejected]
                  description: >
                    Ciclo editorial (social_posts.editorial_status) via domínio
                    Hub. approved em rascunho = bypassApproval (superadmin/bypass).
                    Superadmin não precisa ser membro da org do cliente.
                    Em fila = submitApprovalDecision. draft = cancelApprovalRun.
                status:
                  type: string
                  enum: [draft, approved]
                  description: Alias de editorialStatus (só draft|approved). Não publica.
                comment:
                  type: string
                  maxLength: 2000
                  description: Obrigatório em changes_requested/rejected conforme o fluxo.
                justification:
                  type: string
                  minLength: 5
                  maxLength: 2000
                  description: Justificativa do bypass (rascunho → approved). Default no servidor se omitir.
                actorUserId:
                  type: string
                  format: uuid
                  description: UUID de auth.users. Opcional em update. Só exigido em create com dryRun=false se faltar BLIMBER_MCP_ACTOR_USER_ID.
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou post atualizado
        "401":
          description: Não autorizado

  /api/gpt/marketing/posts/{postId}/approve:
    post:
      operationId: approvePost
      summary: Aprovar ou decidir editorial do post
      description: >
        Avança o ciclo editorial (não publica). dryRun default true.
        Rascunho → approved = bypassApproval (superadmin sem membership).
        Fila pendente = submitApprovalDecision. draft cancela a fila.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                decision:
                  type: string
                  enum: [approved, changes_requested, rejected, draft]
                  default: approved
                comment:
                  type: string
                  maxLength: 2000
                justification:
                  type: string
                  minLength: 5
                  maxLength: 2000
                  description: Justificativa do bypass (rascunho). Default no servidor se omitir.
                requestId:
                  type: string
                  format: uuid
                  description: Opcional. approval_requests.id pendente.
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou post com editorial atualizado
        "401":
          description: Não autorizado
        "403":
          description: Sem permissão / outro tenant
        "409":
          description: Sem fila para changes_requested/rejected

  /api/gpt/marketing/posts/{postId}/submit:
    post:
      operationId: submitPost
      summary: Enviar post para aprovação do cliente
      description: >
        startApprovalWorkflow (stage client). dryRun default true.
        approverIds via listApprovers. Superadmin sem membership.
        Exige confirm + confirmTenantId.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                approverIds:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: uuid
                  description: UUIDs de listApprovers (recomendado no fluxo cliente).
                dueAt:
                  type: string
                  format: date-time
                workflowId:
                  type: string
                  format: uuid
                  description: Opcional. Default simple_client quando stage=client.
                stage:
                  type: string
                  enum: [client, internal]
                  default: client
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou solicitação criada
        "401":
          description: Não autorizado
        "409":
          description: Já em aprovação ou já aprovado

  /api/gpt/marketing/posts/{postId}/schedule:
    post:
      operationId: schedulePost
      summary: Agendar publicação (enqueue real)
      description: >
        Enfileira publication_jobs e marca publication_status=scheduled
        (mesmo enqueueApprovedPost do Hub). Exige post aprovado. ISO com
        offset; tz America/Sao_Paulo. Ex. 2026-08-17T19:00:00-03:00.
        dryRun default true. Superadmin sem membership.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                scheduledAt:
                  type: string
                  format: date-time
                  description: ISO com offset. Se omitir, usa a data já gravada no post.
                timezone:
                  type: string
                  maxLength: 80
                  description: IANA. Default America/Sao_Paulo.
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou post agendado com jobs
        "401":
          description: Não autorizado
        "409":
          description: Post não aprovado — use approvePost primeiro

  /api/gpt/marketing/posts/{postId}/publish:
    post:
      operationId: publishPost
      summary: Publicar agora
      description: >
        enqueueApprovedPost com publishNow. Worker publica na hora.
        Exige aprovado. dryRun default true. Superadmin sem membership.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou jobs enfileirados para agora
        "401":
          description: Não autorizado
        "409":
          description: Post não aprovado — use approvePost primeiro

  /api/gpt/marketing/posts/{postId}/unschedule:
    post:
      operationId: unschedulePost
      summary: Cancelar agendamento
      description: >
        Cancela jobs pending/retrying e volta publication_status=not_scheduled.
        Não remove o post das redes. dryRun default true.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                clearScheduledAt:
                  type: boolean
                  default: false
                  description: Se true, também zera social_posts.scheduled_at.
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou agendamento cancelado
        "401":
          description: Não autorizado
        "409":
          description: Já publicado ou em exclusão

  /api/gpt/marketing/posts/{postId}/delete:
    post:
      operationId: deletePost
      summary: Excluir post editorial (soft-delete)
      description: >
        Soft-delete de 1 social_post (deleted_at). dryRun default true
        (preview id/title/campaignId). Exige confirm + confirmTenantId.
        Use POST (não DELETE): ChatGPT Actions remove body de DELETE.
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID do post (um por chamada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
                actorUserId:
                  type: string
                  format: uuid
                  description: Opcional. Gravado em deleted_by se enviado.
      responses:
        "200":
          description: Preview ou post excluído
        "401":
          description: Não autorizado
        "403":
          description: Post de outro tenant
        "404":
          description: Post não encontrado
        "409":
          description: Já excluído ou publicação em andamento

  /api/gpt/marketing/campaigns:
    get:
      operationId: listEditorialCampaigns
      summary: Listar campanhas editoriais
      description: >
        Lista social_campaigns (conteúdo mensal). NÃO são campanhas Meta Ads.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, completed, cancelled, all]
          description: Filtro de status.
        - name: search
          in: query
          schema:
            type: string
          description: Busca no nome.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Máximo de campanhas (1–100).
      responses:
        "200":
          description: Campanhas editoriais
        "401":
          description: Não autorizado
    post:
      operationId: createEditorialCampaign
      summary: Criar campanha editorial
      description: >
        Cria social_campaigns. dryRun default true (preview, sem actor). Ads
        pagos: Ação Ads. Execute (dryRun=false) exige actorUserId ou
        BLIMBER_MCP_ACTOR_USER_ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, name, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 180
                objective:
                  type: string
                  maxLength: 5000
                status:
                  type: string
                  enum: [draft, active, paused, completed, cancelled]
                  default: draft
                startsAt:
                  type: string
                  description: Início da campanha editorial (ISO ou null).
                endsAt:
                  type: string
                  description: Fim da campanha editorial (ISO ou null).
                briefingSummary:
                  type: string
                  maxLength: 10000
                actorUserId:
                  type: string
                  format: uuid
                  description: UUID de auth.users (created_by). Só exigido em dryRun=false se o servidor não tiver BLIMBER_MCP_ACTOR_USER_ID. Preview não exige.
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou campanha criada
        "401":
          description: Não autorizado

  /api/gpt/marketing/campaigns/{campaignId}:
    get:
      operationId: getEditorialCampaign
      summary: Detalhe campanha editorial
      description: Detalhe + posts vinculados da campanha editorial.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da campanha editorial.
      responses:
        "200":
          description: Campanha
        "401":
          description: Não autorizado
    put:
      operationId: updateEditorialCampaign
      summary: Atualizar campanha editorial
      description: Atualiza nome/objetivo/status/datas/briefing. dryRun default true + confirm. actorUserId opcional.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da campanha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                name:
                  type: string
                  minLength: 1
                  maxLength: 180
                objective:
                  type: string
                  maxLength: 5000
                status:
                  type: string
                  enum: [draft, active, paused, completed, cancelled]
                startsAt:
                  type: string
                  description: Início da campanha editorial (ISO ou null).
                endsAt:
                  type: string
                  description: Fim da campanha editorial (ISO ou null).
                briefingSummary:
                  type: string
                  maxLength: 10000
                actorUserId:
                  type: string
                  format: uuid
                  description: UUID de auth.users. Opcional em update. Só exigido em create com dryRun=false se faltar BLIMBER_MCP_ACTOR_USER_ID.
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou campanha atualizada
        "401":
          description: Não autorizado

  /api/gpt/marketing/approvals:
    get:
      operationId: listApprovals
      summary: Listar solicitações de aprovação
      description: >
        Lista approval_requests do tenant. Decida com approvePost.
        Envie rascunho com submitPost.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, changes_requested, rejected, cancelled, all]
          description: Filtro de run_status.
        - name: stage
          in: query
          schema:
            type: string
            enum: [internal, client]
          description: Etapa do fluxo.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
          description: Máximo de itens.
      responses:
        "200":
          description: Solicitações
        "401":
          description: Não autorizado

  /api/gpt/marketing/approvals/{requestId}/review-link:
    post:
      operationId: createReviewLink
      summary: Gerar link mágico de aprovação
      description: >
        Cria /review/{token} para o cliente. dryRun default true.
        Token só na resposta — nunca logar. Exige confirm.
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID da approval_request pendente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, confirmTenantId, confirm]
              properties:
                tenantId:
                  type: string
                  format: uuid
                expiresInHours:
                  type: integer
                  minimum: 1
                  maximum: 720
                maxUses:
                  type: integer
                  minimum: 1
                  maximum: 1000
                afterDecision:
                  type: string
                  enum: [read_only, invalidate]
                actorUserId:
                  type: string
                  format: uuid
                confirmTenantId:
                  type: string
                  format: uuid
                confirm:
                  type: boolean
                  enum: [true]
                dryRun:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Preview ou link gerado
        "401":
          description: Não autorizado

  /api/gpt/marketing/approvers:
    get:
      operationId: listApprovers
      summary: Listar aprovadores elegíveis
      description: Aprovadores do tenant para submitPost.approverIds. Sem tokens.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
      responses:
        "200":
          description: Aprovadores
        "401":
          description: Não autorizado

  /api/gpt/marketing/calendar:
    get:
      operationId: listCalendar
      summary: Calendário editorial
      description: >
        Slots em marketing_post_schedules no intervalo start/end.
        Mesmo feed do Hub. Slots CRUD via invokeMarketingTool.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa). Nunca misture tenants.
        - name: start
          in: query
          required: true
          schema:
            type: string
          description: ISO início (inclusive).
        - name: end
          in: query
          required: true
          schema:
            type: string
          description: ISO fim (inclusive).
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
          description: Filtrar por campanha editorial.
        - name: platform
          in: query
          schema:
            type: string
            enum: [facebook, instagram, linkedin]
          description: Filtrar plataforma.
      responses:
        "200":
          description: Ocorrências
        "401":
          description: Não autorizado

  /api/gpt/marketing/invoke:
    post:
      operationId: invokeMarketingTool
      summary: Invocação genérica (overflow)
      description: >
        Invoca tool pelo nome. Overflow (workflows, briefings, slots
        do calendário). Writes: dryRun true + confirm. Limite ≤30 ops.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketingInvokeBody"
      responses:
        "200":
          description: Resultado da tool
        "401":
          description: Não autorizado
        "400":
          description: Tool inválida

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: BLIMBER_MCP_API_KEY no GPT (Authentication → API Key → Bearer).
  schemas:
    TenantSearchResponse:
      type: object
      required: [ok, query, tenants]
      properties:
        ok:
          type: boolean
          example: true
        query:
          type: string
          description: Texto de busca normalizado usado na consulta.
        organizationId:
          type: string
          format: uuid
          description: Presente quando a busca foi limitada a uma organização.
        tenants:
          type: array
          items:
            type: object
            required: [id, name, slug]
            properties:
              id:
                type: string
                format: uuid
                description: UUID do tenant — use como tenantId nas outras ações.
              name:
                type: string
                description: Nome do cliente/empresa.
              slug:
                type: string
                description: Slug público do tenant.
    MarketingInvokeBody:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          type: string
          description: Nome canônico da tool MCP. Overflow sem rota REST dedicada.
          enum:
            - marketing_list_social_accounts
            - marketing_list_assets
            - marketing_get_brand_context
            - marketing_list_posts
            - marketing_get_post
            - marketing_create_post
            - marketing_update_post
            - marketing_approve_post
            - marketing_submit_post
            - marketing_schedule_post
            - marketing_publish_post
            - marketing_unschedule_post
            - marketing_delete_post
            - marketing_delete_asset
            - marketing_upload_asset
            - marketing_list_campaigns
            - marketing_get_campaign
            - marketing_create_campaign
            - marketing_update_campaign
            - marketing_list_approvals
            - marketing_list_approvers
            - marketing_list_calendar
            - marketing_update_brand
            - marketing_create_review_link
            - marketing_list_briefings
            - marketing_create_briefing_link
            - marketing_list_workflows
            - marketing_create_calendar_slot
            - marketing_update_calendar_slot
            - marketing_delete_calendar_slot
        arguments:
          type: object
          description: Payload da tool (sempre tenantId; writes com confirm).
