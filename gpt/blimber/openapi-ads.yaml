openapi: 3.1.1
info:
  title: Blimber Meta Ads API
  description: >
    Ação 2 (Meta Ads). Host ads.blimber.com.br (mesmo app que app.*). tenantId
    via searchTenants da Ação Marketing. Nunca peça tokens. Mutações: confirm +
    confirmTenantId; create/edit/delete dryRun default true. Bulk: preview →
    IDs → execute. Este YAML é o contrato Ads canônico no ChatGPT.
  version: 0.8.0
  contact:
    name: Blimber Hub
servers:
  - url: https://ads.blimber.com.br
    description: Alias Ads (mesmo deploy Nuxt/Vercel que app.blimber.com.br)
security:
  - BearerAuth: []
paths:
  /api/gpt/meta/tools:
    get:
      operationId: listMetaTools
      summary: Listar tools Meta disponíveis
      description: Catálogo das operações Meta Ads expostas ao GPT (sem secrets).
      responses:
        "200":
          description: Catálogo de tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsCatalogResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/targeting/interests:
    get:
      operationId: searchInterests
      summary: Buscar interesses Meta (IDs)
      description: >
        Busca interesses na taxonomia Meta (Graph adinterest). Use id+name em
        targeting.interests / flexible_spec ao criar ou editar adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Termo de busca (ex. cosméticos, farmácia estética).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: pt_BR
          description: Locale Meta (default pt_BR).
      responses:
        "200":
          description: Interesses encontrados (id, name, audience_size)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/targeting/geolocations:
    get:
      operationId: searchGeolocations
      summary: Buscar cidades/regiões Meta
      description: >
        Busca geo targeting Meta (Graph adgeolocation). Use key em
        targeting.geo_locations.cities ou regions (não invente keys).
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Termo (ex. São Paulo, Rio de Janeiro).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: locationTypes
          in: query
          required: false
          schema:
            type: string
            default: city,region
          description: Tipos separados por vírgula (city,region,country). Default city,region.
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: Filtro ISO-2 opcional (ex. BR).
      responses:
        "200":
          description: Geolocalizações (key, name, type, country_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/custom-audiences:
    get:
      operationId: listCustomAudiences
      summary: Listar custom audiences
      description: >
        Lista custom audiences da ad account. Use ids em
        targeting.custom_audiences ao criar/editar adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Custom audiences (id, name, subtype, approximate_count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createCustomAudience
      summary: Criar custom audience
      description: >
        Cria público INSTAGRAM, FACEBOOK_PAGE, WEBSITE, LEAD_FORM, CUSTOMER_LIST
        ou LOOKALIKE. event amigável (ex. ALL, ENGAGED). dryRun default true.
        Exige confirm e confirmTenantId. Update/delete/usage via invokeMetaTool.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomAudienceBody"
      responses:
        "200":
          description: Público criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/saved-audiences:
    get:
      operationId: listSavedAudiences
      summary: Listar Saved Audiences (Ads Manager)
      description: >
        Lista públicos salvos da ad account (id, nome, targeting). Filtre por
        name (exato, ex. "CIDADE PIN 2") ou nameContains. Use o id como
        savedAudienceId em createAdset / updateAdsetTargeting — a Graph não
        aceita saved_audience_id no POST; o MCP reutiliza o targeting intacto.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Nome exato do público salvo (case-insensitive).
        - name: nameContains
          in: query
          required: false
          schema:
            type: string
          description: Filtro parcial por nome (case-insensitive).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Saved audiences (id, name, targeting, run_status, contagens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/integrations:
    get:
      operationId: listIntegrations
      summary: Status das integrações do tenant
      description: >
        Lista marketing_integrations do tenantId. Confirme meta_ready e
        write_readiness (ads_management + page token). Sem tokens / sem novos OAuth.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Integrações (sem tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ad-accounts:
    get:
      operationId: listAdAccounts
      summary: Listar contas de anúncio Meta
      description: Lista contas de anúncio acessíveis pelo OAuth Meta do tenant.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Contas de anúncio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns:
    get:
      operationId: listCampaigns
      summary: Listar campanhas Meta
      description: Lista campanhas da conta de anúncio do tenant (leitura). Filtre por status se necessário.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de campanhas a retornar (1–200).
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, ARCHIVED, DELETED]
          description: Filtrar por effective_status da campanha.
      responses:
        "200":
          description: Campanhas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createCampaign
      summary: Criar campanha (PAUSED)
      description: >
        Cria campanha Outcome_*. Default status=PAUSED e dryRun=true (preview).
        Exige confirm=true e confirmTenantId=tenantId. ACTIVE exige confirmActive=true.
        Sem budget de campanha envia is_adset_budget_sharing_enabled=false (ABO).
        Erros Graph trazem code/subcode/user_msg e request_payload sanitizado.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "200":
          description: Campanha criada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: >
            Erro de validação ou Graph (details com code/subcode/user_msg e
            request_payload sanitizado em META_GRAPH_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorToolResponse"

  /api/gpt/meta/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      summary: Detalhe de uma campanha
      description: Obtém o detalhe da campanha e valida se ela pertence à conta de anúncio do tenant.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns/{campaignId}/status:
    post:
      operationId: updateCampaignStatus
      summary: Pausar ou ativar campanha
      description: >
        ACTIVE ou PAUSED. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false nesta ação legada) retorna preview sem POST.
      x-openai-isConsequential: true
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignStatusBody"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets:
    get:
      operationId: listAdsets
      summary: Listar conjuntos de anúncios (adsets)
      description: Lista conjuntos de anúncios da conta ou filtrados por campanha.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar conjuntos de anúncios desta campanha.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de conjuntos de anúncios (1–200).
        - name: detailLevel
          in: query
          schema:
            type: string
            enum: [summary, full]
            default: summary
          description: summary (default) ou full — inclui targeting, promoted_object, attribution_spec, bid_strategy, start/end.
        - name: includeTargeting
          in: query
          schema:
            type: boolean
          description: Atalho legado — true equivale a detailLevel=full.
      responses:
        "200":
          description: Conjuntos de anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAdset
      summary: Criar adset (PAUSED)
      description: >
        Cria adset (BR_* XOR targeting XOR savedAudienceId). PAUSED+dryRun.
        WEBSITE|WHATSAPP. isDynamicCreative opcional (DYNAMIC_CREATIVE_LEGACY; só WEBSITE).
        Exige confirm+budget+campaignId. ACTIVE exige confirmActive.
        Público salvo: listSavedAudiences → savedAudienceId.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdsetBody"
      responses:
        "200":
          description: Adset criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}:
    get:
      operationId: getAdset
      summary: Obter adset Meta
      description: >
        Detalhe completo do adset (targeting, placements, budgets, optimization,
        attribution). Valida ownership da ad account do tenant.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Adset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/copy:
    post:
      operationId: copyAdset
      summary: Duplicar adset Meta
      description: >
        Duplica adset via POST /{adsetId}/copies (fallback sanitize+create).
        Default PAUSED e dryRun=true. confirm + confirmTenantId obrigatórios na execução.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyAdsetBody"
      responses:
        "200":
          description: Adset duplicado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/status:
    post:
      operationId: updateAdsetStatus
      summary: Pausar ou ativar adset
      description: >
        ACTIVE ou PAUSED no adset. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do conjunto de anúncios (adset) na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetStatusBody"
      responses:
        "200":
          description: Status do adset atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/budget:
    post:
      operationId: updateAdsetBudget
      summary: Atualizar budget do adset
      description: >
        dailyBudget ou lifetimeBudget (centavos). dryRun default true. Teto META_GPT_BUDGET_*.
        Aumento % alto exige confirmBudgetIncrease. confirm + confirmTenantId obrigatórios.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetBudgetBody"
      responses:
        "200":
          description: Budget atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/targeting:
    post:
      operationId: updateAdsetTargeting
      summary: Atualizar targeting do adset
      description: >
        targetingTemplate BR_* OU targeting customizado OU savedAudienceId (XOR).
        dryRun default true. confirm + confirmTenantId.
        Público salvo: listSavedAudiences → savedAudienceId (targeting reutilizado intacto).
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetTargetingBody"
      responses:
        "200":
          description: Targeting atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads:
    get:
      operationId: listAds
      summary: Listar anúncios
      description: Lista anúncios da conta, campanha ou adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar por campanha.
        - name: adsetId
          in: query
          schema:
            type: string
          description: Filtrar por conjunto de anúncios (adset).
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Se true, retorna só anúncios ativos.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de anúncios (1–200).
      responses:
        "200":
          description: Anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAd
      summary: Criar anúncio + criativo
      description: >
        Cria anúncio com novo criativo, creativeId ou publicação IG existente
        (instagramMediaId XOR instagramPermalink, apenas INSTAGRAM_PROFILE).
        Publicação existente preserva texto e mídia. Tracking opcional.
        Default PAUSED e dryRun; execute com confirm e dryRun=false.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "200":
          description: Anúncio criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/status:
    post:
      operationId: updateAdStatus
      summary: Pausar ou ativar anúncio
      description: >
        ACTIVE ou PAUSED no anúncio. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdStatusBody"
      responses:
        "200":
          description: Status do anúncio atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/creative-copy:
    post:
      operationId: updateAdCreativeCopy
      summary: Atualizar copy do anúncio
      description: >
        Novo AdCreative + swap (message/headline/description/CTA/link). dryRun default true.
        Exige Page. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdCreativeCopyBody"
      responses:
        "200":
          description: Copy atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/media:
    post:
      operationId: updateAdMedia
      summary: Atualizar mídia do anúncio
      description: >
        imageUrl ou imageHash via novo AdCreative + swap; preserva copy. dryRun default true.
        Sem video/upload. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdMediaBody"
      responses:
        "200":
          description: Mídia atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/tracking:
    post:
      operationId: updateAdTracking
      summary: Atualizar tracking do anúncio
      description: >
        POST Graph tracking_specs (Pixel/Dataset) e/ou conversion_domain.
        Merge com GET (default). replaceTrackingSpecs=true sobrescreve.
        dryRun default true. confirm + confirmTenantId. Ownership da ad account.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdTrackingBody"
      responses:
        "200":
          description: Tracking atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/preview:
    post:
      operationId: previewBulkDelete
      summary: Preview exclusão em massa (IDs explícitos)
      description: >
        Valida ownership dos IDs (level campaign|adset|ad), retorna tabela
        nome/status/budget e previewToken (TTL). Sem POST na Graph.
        NUNCA apague por nome — só IDs explícitos (máx. META_GPT_BULK_MAX).
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewBulkDeleteBody"
      responses:
        "200":
          description: Preview + previewToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/execute:
    post:
      operationId: executeBulkDelete
      summary: Executar exclusão em massa (após preview)
      description: >
        Exige previewToken recente + confirm + confirmTenantId + confirmDelete=true
        + dryRun=false. Processa sequencialmente (succeeded/failed).
        Default dryRun=true (sem mutação). Preferir deleteMode=DELETED.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteBulkDeleteBody"
      responses:
        "200":
          description: Resultado parcial ou total da exclusão / dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/insights:
    post:
      operationId: getInsights
      summary: Consultar insights Meta
      description: >
        Métricas (impressions, spend, CTR, etc.) por nível account|campaign|adset|ad
        e período (datePreset ou custom). Sempre informe tenantId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsBody"
      responses:
        "200":
          description: Métricas (insights)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/invoke:
    post:
      operationId: invokeMetaTool
      summary: Invocação genérica (alternativa)
      description: >
        Invoca tool pelo nome. Overflow (capabilities, upload, catalogs, pixels,
        datasets, tracking, experiments) usa este endpoint. Limite ≤30 ops.
        Também oferece descoberta de Instagram e criação a partir de publicação existente.
        imageUrl XOR imageHash XOR assetId. studyOwner AUTO|USER|BUSINESS.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeBody"
            examples:
              instagramMedia:
                summary: Listar publicações do Instagram conectado
                value:
                  tool: meta_list_instagram_media
                  arguments: { tenantId: "00000000-0000-4000-8000-000000000001", limit: 25 }
              instagramPostPreview:
                summary: Preview sem criar anúncio
                value:
                  tool: meta_create_ad_from_instagram_post
                  arguments: { tenantId: "00000000-0000-4000-8000-000000000001", adsetId: "123456789", name: "Reel existente", instagramMediaId: "17841400000000001", confirmTenantId: "00000000-0000-4000-8000-000000000001", confirm: true, dryRun: true }
      responses:
        "200":
          description: Resultado da tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: BLIMBER_MCP_API_KEY no GPT (Authentication → API Key → Bearer).

  schemas:
    OkToolResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tool:
          type: string
        data:
          type: object
          description: Payload tipado da tool (estrutura varia por operação).
    AdvantageFeatureEnroll:
      type: object
      required: [enrollStatus]
      properties:
        enrollStatus:
          type: string
          enum: [OPT_IN, OPT_OUT]
    ErrorToolResponse:
      type: object
      description: >
        Erro tipado. Em META_GRAPH_ERROR, details inclui code, error_subcode,
        error_user_title, error_user_msg, fbtrace_id e request_payload (sem tokens).
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            details:
              type: object
              description: Campos Graph + request_payload sanitizado em writes.
    ToolsCatalogResponse:
      type: object
      properties:
        server:
          type: string
        version:
          type: string
        primary:
          type: string
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              arguments:
                type: array
                items:
                  type: string
    InsightsBody:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: UUID do tenant.
        adAccountId:
          type: string
          description: Conta de anúncio opcional (sem prefixo act_).
        level:
          type: string
          enum: [account, campaign, adset, ad]
          default: campaign
        datePreset:
          type: string
          enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, custom]
          default: last_7d
        dateStart:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        dateEnd:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        metrics:
          type: array
          items:
            type: string
          description: Campos Graph opcionais; o padrão inclui spend, clicks e impressions.
        objectId:
          type: string
          description: ID de campanha, conjunto ou anúncio para insights desse nó.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    UpdateCampaignStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false nesta ação (retrocompatível).
    UpdateAdsetStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false (espelho da campanha).
    UpdateAdStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false (espelho da campanha).
    CreateCampaignBody:
      type: object
      required: [tenantId, name, objective, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome da campanha.
        objective:
          type: string
          enum:
            - OUTCOME_AWARENESS
            - OUTCOME_ENGAGEMENT
            - OUTCOME_LEADS
            - OUTCOME_SALES
            - OUTCOME_TRAFFIC
            - OUTCOME_APP_PROMOTION
          description: Objetivos Outcome_* (legados rejeitados).
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (XOR com dailyBudget).
        specialAdCategories:
          type: array
          items:
            type: string
            enum:
              - CREDIT
              - EMPLOYMENT
              - HOUSING
              - ISSUES_ELECTIONS_POLITICS
              - ONLINE_GAMBLING_AND_GAMING
              - FINANCIAL_PRODUCTS_SERVICES
          description: Categorias especiais Meta (vazio = nenhuma).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    MetaCustomTargeting:
      type: object
      description: >
        Subconjunto validado do targeting Graph. Exige geo_locations com
        countries e/ou cities e/ou regions. interests/behaviors no topo
        viram flexible_spec. Não envie junto com targetingTemplate.
      properties:
        age_min:
          type: integer
          minimum: 13
          maximum: 65
        age_max:
          type: integer
          minimum: 13
          maximum: 65
        genders:
          type: array
          items:
            type: integer
            enum: [1, 2]
          description: 1=masculino, 2=feminino. Omitir = todos.
          minItems: 1
          maxItems: 2
        geo_locations:
          type: object
          properties:
            countries:
              type: array
              items:
                type: string
                minLength: 2
                maxLength: 2
              description: ISO country codes (ex. BR).
            cities:
              type: array
              items:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  radius:
                    type: number
                  distance_unit:
                    type: string
                    enum: [kilometer, mile]
            regions:
              type: array
              items:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                  name:
                    type: string
            location_types:
              type: array
              items:
                type: string
                enum: [home, recent, travel_in]
        locales:
          type: array
          items:
            type: integer
        interests:
          type: array
          description: Atalho → flexible_spec[0].interests (IDs Meta).
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              name:
                type: string
        behaviors:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              name:
                type: string
        flexible_spec:
          type: array
          items:
            type: object
            properties:
              interests:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
              behaviors:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
        exclusions:
          type: object
          properties:
            interests:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  name: { type: string }
            behaviors:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  name: { type: string }
        custom_audiences:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
        excluded_custom_audiences:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
        publisher_platforms:
          type: array
          items:
            type: string
            enum: [facebook, instagram, audience_network, messenger]
        facebook_positions:
          type: array
          items:
            type: string
        instagram_positions:
          type: array
          items:
            type: string
        device_platforms:
          type: array
          items:
            type: string
            enum: [mobile, desktop]
    CreateAdsetBody:
      type: object
      required:
        - tenantId
        - campaignId
        - name
        - billingEvent
        - optimizationGoal
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        campaignId:
          type: string
          description: ID da campanha (mesma ad account do tenant).
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome do adset.
        targetingTemplate:
          type: string
          enum: [BR_18_65, BR_25_54, BR_18_34, BR_35_65]
          description: Preset geo+idade. XOR com targeting / savedAudienceId — envie apenas um.
        targeting:
          $ref: "#/components/schemas/MetaCustomTargeting"
        savedAudienceId:
          type: string
          minLength: 1
          description: >
            ID de Saved Audience (listSavedAudiences). Reutiliza o targeting salvo
            sem recriar segmentação. XOR com targetingTemplate e targeting.
        advantageAudience:
          type: integer
          enum: [0, 1]
          description: >
            targeting_automation.advantage_audience (Graph v23+). Default 0 (BAU com idade/geo).
            Use 1 só para optar em Advantage+ audience.
        billingEvent:
          type: string
          enum: [IMPRESSIONS, LINK_CLICKS]
          description: Cobrança. CTWA (WHATSAPP) exige IMPRESSIONS.
        optimizationGoal:
          type: string
          enum:
            - REACH
            - IMPRESSIONS
            - LINK_CLICKS
            - LANDING_PAGE_VIEWS
            - OFFSITE_CONVERSIONS
            - LEAD_GENERATION
            - QUALITY_LEAD
            - CONVERSATIONS
            - THRUPLAY
            - POST_ENGAGEMENT
            - PROFILE_VISIT
            - PROFILE_AND_PAGE_ENGAGEMENT
          description: >
            Otimização. CTWA tipicamente CONVERSATIONS. Perfil do Instagram:
            PROFILE_VISIT com OUTCOME_TRAFFIC ou PROFILE_AND_PAGE_ENGAGEMENT com OUTCOME_ENGAGEMENT.
        destinationType:
          type: string
          enum: [WEBSITE, WHATSAPP, MESSENGER, INSTAGRAM_DIRECT, INSTAGRAM_PROFILE]
          default: WEBSITE
          description: Destino do adset. INSTAGRAM_PROFILE usa o Instagram profissional conectado.
        pixelId:
          type: string
          pattern: '^[0-9]+$'
          description: Pixel explícito da conta; obrigatório em WEBSITE + OFFSITE_CONVERSIONS.
        customEventType:
          type: string
          enum: [PURCHASE, LEAD, COMPLETE_REGISTRATION, ADD_TO_CART, INITIATED_CHECKOUT, ADD_PAYMENT_INFO, CONTENT_VIEW, SEARCH, CONTACT, SUBSCRIBE, START_TRIAL, SCHEDULE, SUBMIT_APPLICATION, ADD_TO_WISHLIST, DONATE, FIND_LOCATION, CUSTOMIZE_PRODUCT, OTHER]
          description: Evento otimizado no site; obrigatório junto de pixelId em WEBSITE + OFFSITE_CONVERSIONS.
        isDynamicCreative:
          type: boolean
          description: >
            Se true, POST com is_dynamic_creative=true (Dynamic Creative legado).
            Só WEBSITE. Ads devem usar creativeType=DYNAMIC_CREATIVE_LEGACY + assetFeed.
        campaignObjective:
          type: string
          enum:
            - OUTCOME_AWARENESS
            - OUTCOME_ENGAGEMENT
            - OUTCOME_LEADS
            - OUTCOME_SALES
            - OUTCOME_TRAFFIC
            - OUTCOME_APP_PROMOTION
          description: Objective da campanha p/ validar destino/otimização no dry-run.
        whatsappPhoneNumber:
          type: string
          description: Opcional. Telefone E.164 no promoted_object CTWA.
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (exige endTime).
        startTime:
          type: string
          description: Início ISO-8601 opcional.
        endTime:
          type: string
          description: Fim ISO-8601 (obrigatório com lifetimeBudget).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    CopyAdsetBody:
      type: object
      required:
        - tenantId
        - name
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome do novo adset.
        campaignId:
          type: string
          description: Campanha destino. Omitido = mesma campanha do adset origem.
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED por segurança.
        dailyBudget:
          type: integer
          minimum: 1
          description: Override daily_budget em centavos após cópia.
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Override lifetime_budget em centavos após cópia.
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para duplicar.
    CreateAdBody:
      type: object
      required:
        - tenantId
        - adsetId
        - name
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        adsetId:
          type: string
          description: ID do adset (mesma ad account do tenant).
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome do anúncio.
        creativeId:
          type: string
          description: >
            Reusa AdCreative existente (XOR com creativeType/mídia/copy).
            Ownership validada no execute (mesma ad account).
        instagramMediaId:
          type: string
          pattern: '^\d{5,30}$'
          description: >
            ID numérico de publicação do Instagram profissional conectado.
            XOR instagramPermalink|creativeId|copy|mídia. Somente INSTAGRAM_PROFILE.
            Ownership conferida no execute; dryRun não consulta Graph.
        instagramPermalink:
          type: string
          format: uri
          description: >
            Link https://www.instagram.com/p/… ou /reel/… da publicação conectada.
            No execute, busca o ID nas mídias desta conta (até 1.000 itens). Para
            publicação mais antiga, use instagramMediaId. Não faz fetch da URL.
        creativeType:
          type: string
          enum: [IMAGE, VIDEO, CAROUSEL, DYNAMIC_CREATIVE_LEGACY, CATALOG]
          default: IMAGE
          description: >
            IMAGE|VIDEO|CAROUSEL|DYNAMIC_CREATIVE_LEGACY|CATALOG (ou creativeId XOR).
            Advantage+ = degreesOfFreedomSpec. Mídia flexível Ads Manager = pac_relaxation.
            Flexible Ad Format (creative_asset_groups_spec) não suportado — capability=false.
            Omita ao usar instagramMediaId ou instagramPermalink.
        destinationType:
          type: string
          enum: [WEBSITE, WHATSAPP, MESSENGER, INSTAGRAM_DIRECT, INSTAGRAM_PROFILE]
          default: WEBSITE
          description: >
            WEBSITE exige linkUrl; WHATSAPP|MESSENGER|INSTAGRAM_DIRECT = Click-to-Message;
            INSTAGRAM_PROFILE resolve identidade e URL pelo Instagram profissional conectado.
        linkUrl:
          type: string
          format: uri
          description: URL https de site (IMAGE/VIDEO/CAROUSEL WEBSITE). Rejeita wa.me; nunca inventar.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto principal. Obrigatório IMAGE/VIDEO/CAROUSEL (sem creativeId).
        headline:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        callToAction:
          type: string
          enum:
            - LEARN_MORE
            - SHOP_NOW
            - SIGN_UP
            - SUBSCRIBE
            - CONTACT_US
            - DOWNLOAD
            - GET_OFFER
            - BOOK_NOW
            - BUY_NOW
            - APPLY_NOW
            - GET_QUOTE
            - WHATSAPP_MESSAGE
            - MESSAGE_PAGE
            - INSTAGRAM_MESSAGE
          description: WEBSITE default LEARN_MORE; destinos de mensagem forçam CTA oficial.
        welcomeMessage:
          type: string
          maxLength: 1000
          description: Destinos de mensagem (IMAGE|VIDEO|CAROUSEL) — saudação/autofill (page_welcome_message).
        imageUrl:
          type: string
          format: uri
          description: URL https de imagem (upload SSRF no execute). XOR imageHash|assetId. Nunca inventar.
        imageHash:
          type: string
          description: image_hash já na conta (XOR imageUrl|assetId).
        assetId:
          type: string
          format: uuid
          description: >
            UUID do arquivo na Biblioteca de mídia (media_assets) do tenant.
            Servidor baixa internamente e envia à Meta (adimages) → imageHash.
            XOR imageUrl|imageHash. Só IMAGE (JPG/PNG/GIF). Vídeo não suportado.
        videoId:
          type: string
          description: video_id já na biblioteca Meta (VIDEO). XOR videoUrl.
        videoUrl:
          type: string
          format: uri
          description: HTTPS para upload Advideo no execute (SSRF). XOR videoId. dryRun não faz upload.
        childAttachments:
          type: array
          minItems: 2
          maxItems: 10
          description: Obrigatório em CAROUSEL — cards com imageHash|imageUrl|videoId (link só WEBSITE).
          items:
            type: object
            properties:
              link:
                type: string
                format: uri
                description: Só WEBSITE. Omita em destinos de mensagem.
              name:
                type: string
                maxLength: 255
              description:
                type: string
                maxLength: 500
              imageHash:
                type: string
              imageUrl:
                type: string
                format: uri
              videoId:
                type: string
        assetFeed:
          type: object
          description: >
            Obrigatório em DYNAMIC_CREATIVE_LEGACY (asset_feed_spec).
            Adset deve ter is_dynamic_creative=true (createAdset.isDynamicCreative).
          properties:
            bodies:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            titles:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            descriptions:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            images:
              type: array
              items:
                type: object
                required: [hash]
                properties:
                  hash:
                    type: string
            videos:
              type: array
              items:
                type: object
                required: [videoId]
                properties:
                  videoId:
                    type: string
                  thumbnailUrl:
                    type: string
                    format: uri
                  thumbnailHash:
                    type: string
            linkUrls:
              type: array
              minItems: 1
              items:
                type: object
                required: [websiteUrl]
                properties:
                  websiteUrl:
                    type: string
                    format: uri
            callToActionTypes:
              type: array
              minItems: 1
              items:
                type: string
            adFormats:
              type: array
              minItems: 1
              items:
                type: string
                enum: [SINGLE_IMAGE, SINGLE_VIDEO, CAROUSEL, AUTOMATIC_FORMAT]
        degreesOfFreedomSpec:
          type: object
          description: >
            Advantage+ Creative (creative_features_spec). pac_relaxation = Mídia flexível
            no Ads Manager. Não usar com DYNAMIC_CREATIVE_LEGACY. Chaves whitelist:
            pac_relaxation, text_optimizations, image_touchups, enhance_cta, etc.
          properties:
            creativeFeaturesSpec:
              type: object
              description: Map feature → enrollStatus OPT_IN|OPT_OUT.
              properties:
                pac_relaxation:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                text_optimizations:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_touchups:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                enhance_cta:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                adapt_to_placement:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                media_type_automation:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_template:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                inline_comment:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_brightness_and_contrast:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
        placementAssets:
          $ref: "#/components/schemas/PlacementAssets"
        catalogId:
          type: string
          description: CATALOG — product catalog id (via meta_list_catalogs / invoke).
        productSetId:
          type: string
          description: CATALOG — product_set_id (via meta_list_product_sets / invoke).
        trackingSpecs:
          type: array
          minItems: 1
          maxItems: 20
          description: >
            Graph tracking_specs no Ad. Preferir type=website|offline|crm
            (pixelId/datasetId) ou actionType Graph. IDs via meta_list_pixels / meta_list_datasets.
          items:
            $ref: "#/components/schemas/AdTrackingSpec"
        pixelId:
          type: string
          description: Atalho Pixel → offsite_conversion + fb_pixel.
        offlineDatasetId:
          type: string
          description: Atalho Dataset offline → offline_conversion + dataset.
        conversionDomain:
          type: string
          description: Graph conversion_domain (ex. exemplo.com), sem https/path.
        creativeName:
          type: string
          maxLength: 400
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    UpdateAdsetBudgetBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        dailyBudget:
          type: integer
          minimum: 1
          description: Novo daily em centavos (XOR lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Novo lifetime em centavos (XOR dailyBudget).
        endTime:
          type: string
          description: ISO-8601; obrigatório se lifetime sem end_time atual.
        confirmBudgetIncrease:
          type: boolean
          enum: [true]
          description: Se aumento % > teto env.
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdsetTargetingBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        targetingTemplate:
          type: string
          enum: [BR_18_65, BR_25_54, BR_18_34, BR_35_65]
          description: Preset BR_*. XOR com targeting / savedAudienceId.
        targeting:
          $ref: "#/components/schemas/MetaCustomTargeting"
        savedAudienceId:
          type: string
          minLength: 1
          description: >
            ID de Saved Audience — aplica o targeting salvo no adset sem recriar
            segmentação. XOR com targetingTemplate / targeting.
        advantageAudience:
          type: integer
          enum: [0, 1]
          description: >
            targeting_automation.advantage_audience (Graph v23+). Default 0.
            Use 1 para Advantage+ audience.
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdCreativeCopyBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        message:
          type: string
          maxLength: 2000
        headline:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        callToAction:
          type: string
          enum:
            - LEARN_MORE
            - SHOP_NOW
            - SIGN_UP
            - SUBSCRIBE
            - CONTACT_US
            - DOWNLOAD
            - GET_OFFER
            - BOOK_NOW
            - BUY_NOW
            - APPLY_NOW
            - GET_QUOTE
            - WHATSAPP_MESSAGE
        linkUrl:
          type: string
          format: uri
        creativeName:
          type: string
          maxLength: 400
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdMediaBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        imageUrl:
          type: string
          format: uri
          description: HTTPS (XOR imageHash). Nunca inventar.
        imageHash:
          type: string
        placementAssets:
          $ref: "#/components/schemas/PlacementAssets"
        creativeName:
          type: string
          maxLength: 400
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdTrackingBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        trackingSpecs:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/AdTrackingSpec"
        pixelId:
          type: string
          description: Atalho Pixel (offsite_conversion + fb_pixel).
        offlineDatasetId:
          type: string
          description: Atalho Dataset offline (offline_conversion + dataset).
        conversionDomain:
          type: string
          description: Graph conversion_domain (ex. exemplo.com).
        replaceTrackingSpecs:
          type: boolean
          default: false
          description: true = substitui tracking_specs. false (default) = merge com GET.
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    PreviewBulkDeleteBody:
      type: object
      required: [tenantId, level, ids]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        level:
          type: string
          enum: [campaign, adset, ad]
        ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: IDs Meta explícitos (nunca por nome). Máx. META_GPT_BULK_MAX.
        deleteMode:
          type: string
          enum: [DELETED, ARCHIVED]
          default: DELETED
    ExecuteBulkDeleteBody:
      type: object
      required: [tenantId, level, ids, previewToken, confirmTenantId, confirm, confirmDelete]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        level:
          type: string
          enum: [campaign, adset, ad]
        ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: Mesmos IDs do preview (deletableIds).
        previewToken:
          type: string
          description: Token de meta_preview_bulk_delete (TTL).
        deleteMode:
          type: string
          enum: [DELETED, ARCHIVED]
          default: DELETED
        confirmDelete:
          type: boolean
          enum: [true]
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true. Execute real só com false após confirmação.
    CreateCustomAudienceBody:
      type: object
      required: [tenantId, sourceType, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        name:
          type: string
          description: Opcional. Sem nome, gera padrão (ex. IG | Engajamento | 365d).
        description:
          type: string
        sourceType:
          type: string
          enum: [INSTAGRAM, FACEBOOK_PAGE, WEBSITE, LEAD_FORM, CUSTOMER_LIST, LOOKALIKE]
        event:
          type: string
          description: >
            INSTAGRAM ALL|FOLLOWERS|PROFILE_VISIT|ENGAGED|MESSAGED|SAVED.
            PAGE FOLLOWERS|ENGAGED|PAGE_VISIT|POST_ENGAGEMENT|CTA_CLICK|MESSAGED|SAVED.
            WEBSITE ALL_VISITORS|VISITORS_BY_URL|ViewContent|Lead|AddToCart|InitiateCheckout|Purchase|CompleteRegistration.
            LEAD_FORM OPENED|DROPOFF|SUBMITTED.
        retentionDays:
          type: integer
          description: Dias (convertido a segundos). Seguidores = 0.
        instagramAccountId:
          type: string
        pageId:
          type: string
        pixelId:
          type: string
        leadFormId:
          type: string
        urlContains:
          type: string
        originAudienceId:
          type: string
          description: Seed do lookalike (não pode ser outro LAL).
        lookalikeRatio:
          type: number
          description: 0.01 a 0.20 (1% a 20%).
        lookalikeCountry:
          type: string
          description: ISO-2 (default BR).
        prefill:
          type: boolean
        duplicateStrategy:
          type: string
          enum: [ERROR, RETURN_EXISTING, CREATE_ANYWAY]
          default: ERROR
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true. Criação real exige false.
    AdTrackingSpec:
      type: object
      description: >
        type website|offline|crm (pixelId/datasetId) ou actionType Graph + fbPixel/dataset.
        website=Pixel; offline=Dataset; crm=leadgen_quality_conversion (Pixel XOR Dataset).
      properties:
        type:
          type: string
          enum: [website, offline, crm]
        pixelId:
          type: string
        datasetId:
          type: string
        actionType:
          type: string
          enum: [offsite_conversion, offline_conversion, leadgen_quality_conversion]
        fbPixel:
          type: string
        dataset:
          type: string
    PlacementAssets:
      type: object
      required: [images, rules]
      description: >
        Placement Asset Customization — imagens/vídeos diferentes por posicionamento.
        Gera asset_feed_spec (ad_formats AUTOMATIC_FORMAT) + asset_customization_rules no criativo.
      properties:
        images:
          type: array
          minItems: 1
          items:
            type: object
            required: [label]
            properties:
              imageHash:
                type: string
              imageUrl:
                type: string
                format: uri
              assetId:
                type: string
                format: uuid
              label:
                type: string
                description: Rótulo único para vincular a imagem a regras de posicionamento.
        videos:
          type: array
          items:
            type: object
            required: [label]
            properties:
              videoId:
                type: string
              videoUrl:
                type: string
                format: uri
              label:
                type: string
                description: Rótulo único para vincular o vídeo a regras de posicionamento.
        rules:
          type: array
          minItems: 1
          items:
            type: object
            required: [label]
            properties:
              label:
                type: string
                description: Label do asset (imagem ou vídeo) que esta regra utiliza.
              platforms:
                type: array
                items:
                  type: string
                  enum: [facebook, instagram, messenger, audience_network]
              facebookPositions:
                type: array
                items:
                  type: string
              instagramPositions:
                type: array
                items:
                  type: string
              messengerPositions:
                type: array
                items:
                  type: string
              audienceNetworkPositions:
                type: array
                items:
                  type: string
    InvokeBody:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          type: string
          description: >
            Nome canônico da tool MCP/HTTP. Tools sem rota REST dedicada
            (capabilities, upload, catalogs, pixels, datasets, tracking, experiments)
            só via invoke.
          enum:
            - meta_list_integrations
            - meta_list_ad_accounts
            - meta_list_instagram_accounts
            - meta_list_instagram_media
            - meta_get_instagram_media
            - meta_list_campaigns
            - meta_get_campaign
            - meta_list_adsets
            - meta_get_adset
            - meta_copy_adset
            - meta_list_ads
            - meta_get_ad
            - meta_get_creative
            - meta_list_creatives
            - meta_get_insights
            - meta_search_interests
            - meta_search_geolocations
            - meta_list_custom_audiences
            - meta_list_saved_audiences
            - meta_create_custom_audience
            - meta_create_custom_audiences_batch
            - meta_update_custom_audience
            - meta_delete_custom_audience
            - meta_get_custom_audience_usage
            - meta_update_campaign_status
            - meta_update_adset_status
            - meta_update_ad_status
            - meta_create_campaign
            - meta_create_adset
            - meta_create_ad
            - meta_create_ad_from_instagram_post
            - meta_update_adset_budget
            - meta_update_adset_targeting
            - meta_update_ad_creative_copy
            - meta_update_ad_media
            - meta_preview_bulk_delete
            - meta_execute_bulk_delete
            - meta_get_capabilities
            - meta_upload_image
            - meta_upload_video
            - meta_get_video_status
            - meta_list_catalogs
            - meta_list_product_sets
            - meta_list_pixels
            - meta_list_datasets
            - meta_update_ad_tracking
            - meta_list_experiments
            - meta_check_experiment_eligibility
            - meta_create_experiment
            - meta_get_experiment
            - meta_stop_experiment
            - meta_list_placement_options
        arguments:
          type: object
          description: >
            Payload da tool (sempre com tenantId).
            meta_create_ad_from_instagram_post exige adsetId, name,
            instagramMediaId XOR instagramPermalink, confirmTenantId e confirm=true;
            cria sempre PAUSED e dryRun=true por default.
            meta_upload_image: imageUrl XOR imageHash XOR assetId (UUID da Biblioteca).
