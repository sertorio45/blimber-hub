openapi: 3.1.1
info:
  title: Blimber Meta Ads API
  description: >
    Ação 2 (Meta Ads). Host ads.blimber.com.br (mesmo app que app.*). tenantId
    via searchTenants da Ação Marketing. Nunca peça tokens. Mutações: confirm +
    confirmTenantId; create/edit/delete dryRun default true. Bulk: preview →
    IDs → execute. Este YAML é o contrato Ads canônico no ChatGPT.
  version: 0.8.0
  contact:
    name: Blimber Hub
servers:
  - url: https://ads.blimber.com.br
    description: Alias Ads (mesmo deploy Nuxt/Vercel que app.blimber.com.br)
security:
  - BearerAuth: []
paths:
  /api/gpt/meta/tools:
    get:
      operationId: listMetaTools
      summary: Listar tools Meta disponíveis
      description: Catálogo das operações Meta Ads expostas ao GPT (sem secrets).
      responses:
        "200":
          description: Catálogo de tools
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsCatalogResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "503":
          description: Serviço indisponível — BLIMBER_MCP_API_KEY não configurado no servidor

  /api/gpt/meta/targeting/interests:
    get:
      operationId: searchInterests
      summary: Buscar interesses Meta (IDs)
      description: >
        Busca interesses na taxonomia Meta (Graph adinterest). Use id+name em
        targeting.interests / flexible_spec ao criar ou editar adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Termo de busca (ex. cosméticos, farmácia estética).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: pt_BR
          description: Locale Meta (default pt_BR).
      responses:
        "200":
          description: Interesses encontrados (id, name, audience_size)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/targeting/geolocations:
    get:
      operationId: searchGeolocations
      summary: Buscar cidades/regiões Meta
      description: >
        Busca geo targeting Meta (Graph adgeolocation). Use key em
        targeting.geo_locations.cities ou regions (não invente keys).
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Termo (ex. São Paulo, Rio de Janeiro).
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: locationTypes
          in: query
          required: false
          schema:
            type: string
            default: city,region
          description: Tipos separados por vírgula (city,region,country). Default city,region.
        - name: countryCode
          in: query
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: Filtro ISO-2 opcional (ex. BR).
      responses:
        "200":
          description: Geolocalizações (key, name, type, country_code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/custom-audiences:
    get:
      operationId: listCustomAudiences
      summary: Listar custom audiences
      description: >
        Lista custom audiences da ad account. Use ids em
        targeting.custom_audiences ao criar/editar adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Custom audiences (id, name, subtype, approximate_count)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createCustomAudience
      summary: Criar custom audience
      description: >
        Cria público INSTAGRAM, FACEBOOK_PAGE, WEBSITE, LEAD_FORM, CUSTOMER_LIST
        ou LOOKALIKE. event amigável (ex. ALL, ENGAGED). dryRun default true.
        Exige confirm e confirmTenantId. Update/delete/usage via invokeMetaTool.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomAudienceBody"
      responses:
        "200":
          description: Público criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/integrations:
    get:
      operationId: listIntegrations
      summary: Status das integrações do tenant
      description: >
        Lista marketing_integrations do tenantId. Confirme meta_ready e
        write_readiness (ads_management + page token). Sem tokens / sem novos OAuth.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Integrações (sem tokens)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ad-accounts:
    get:
      operationId: listAdAccounts
      summary: Listar contas de anúncio Meta
      description: Lista contas de anúncio acessíveis pelo OAuth Meta do tenant.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
      responses:
        "200":
          description: Contas de anúncio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns:
    get:
      operationId: listCampaigns
      summary: Listar campanhas Meta
      description: Lista campanhas da conta de anúncio do tenant (leitura). Filtre por status se necessário.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de campanhas a retornar (1–200).
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED, ARCHIVED, DELETED]
          description: Filtrar por effective_status da campanha.
      responses:
        "200":
          description: Campanhas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createCampaign
      summary: Criar campanha (PAUSED)
      description: >
        Cria campanha Outcome_*. Default status=PAUSED e dryRun=true (preview).
        Exige confirm=true e confirmTenantId=tenantId. ACTIVE exige confirmActive=true.
        Sem budget de campanha envia is_adset_budget_sharing_enabled=false (ABO).
        Erros Graph trazem code/subcode/user_msg e request_payload sanitizado.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignBody"
      responses:
        "200":
          description: Campanha criada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: >
            Erro de validação ou Graph (details com code/subcode/user_msg e
            request_payload sanitizado em META_GRAPH_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorToolResponse"

  /api/gpt/meta/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      summary: Detalhe de uma campanha
      description: Obtém o detalhe da campanha e valida se ela pertence à conta de anúncio do tenant.
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
      responses:
        "200":
          description: Campanha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/campaigns/{campaignId}/status:
    post:
      operationId: updateCampaignStatus
      summary: Pausar ou ativar campanha
      description: >
        ACTIVE ou PAUSED. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false nesta ação legada) retorna preview sem POST.
      x-openai-isConsequential: true
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
          description: ID da campanha na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignStatusBody"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets:
    get:
      operationId: listAdsets
      summary: Listar conjuntos de anúncios (adsets)
      description: Lista conjuntos de anúncios da conta ou filtrados por campanha.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar conjuntos de anúncios desta campanha.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de conjuntos de anúncios (1–200).
      responses:
        "200":
          description: Conjuntos de anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAdset
      summary: Criar adset (PAUSED)
      description: >
        Cria adset (BR_* XOR targeting). PAUSED+dryRun. WEBSITE|WHATSAPP.
        isDynamicCreative opcional (DYNAMIC_CREATIVE_LEGACY; só WEBSITE).
        Exige confirm+budget+campaignId. ACTIVE exige confirmActive.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdsetBody"
      responses:
        "200":
          description: Adset criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/status:
    post:
      operationId: updateAdsetStatus
      summary: Pausar ou ativar adset
      description: >
        ACTIVE ou PAUSED no adset. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do conjunto de anúncios (adset) na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetStatusBody"
      responses:
        "200":
          description: Status do adset atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/budget:
    post:
      operationId: updateAdsetBudget
      summary: Atualizar budget do adset
      description: >
        dailyBudget ou lifetimeBudget (centavos). dryRun default true. Teto META_GPT_BUDGET_*.
        Aumento % alto exige confirmBudgetIncrease. confirm + confirmTenantId obrigatórios.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetBudgetBody"
      responses:
        "200":
          description: Budget atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/adsets/{adsetId}/targeting:
    post:
      operationId: updateAdsetTargeting
      summary: Atualizar targeting do adset
      description: >
        targetingTemplate BR_* OU targeting customizado (XOR). dryRun default true.
        confirm + confirmTenantId.
      x-openai-isConsequential: true
      parameters:
        - name: adsetId
          in: path
          required: true
          schema:
            type: string
          description: ID do adset na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdsetTargetingBody"
      responses:
        "200":
          description: Targeting atualizado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads:
    get:
      operationId: listAds
      summary: Listar anúncios
      description: Lista anúncios da conta, campanha ou adset.
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID do tenant (empresa) no Blimber. Obrigatório — nunca misture tenants.
        - name: adAccountId
          in: query
          required: false
          schema:
            type: string
          description: Conta de anúncios sem prefixo act_. Usa a da integração se omitido.
        - name: campaignId
          in: query
          schema:
            type: string
          description: Filtrar por campanha.
        - name: adsetId
          in: query
          schema:
            type: string
          description: Filtrar por conjunto de anúncios (adset).
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
          description: Se true, retorna só anúncios ativos.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Máximo de anúncios (1–200).
      responses:
        "200":
          description: Anúncios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta
    post:
      operationId: createAd
      summary: Criar anúncio + criativo
      description: >
        Cria AdCreative+Ad. creativeType IMAGE|VIDEO|CAROUSEL|DYNAMIC_CREATIVE_LEGACY|CATALOG
        ou creativeId (XOR). WEBSITE/WHATSAPP(CTWA). Mídia hash/videoId ou upload HTTPS.
        Advantage+ via degreesOfFreedomSpec. PAUSED+dryRun. Detalhes: meta_get_capabilities / docs.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "200":
          description: Anúncio criado ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/status:
    post:
      operationId: updateAdStatus
      summary: Pausar ou ativar anúncio
      description: >
        ACTIVE ou PAUSED no anúncio. Exige confirm=true e confirmTenantId=tenantId.
        dryRun opcional (default false) retorna preview sem POST. Audit em mutação.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta Graph API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdStatusBody"
      responses:
        "200":
          description: Status do anúncio atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/creative-copy:
    post:
      operationId: updateAdCreativeCopy
      summary: Atualizar copy do anúncio
      description: >
        Novo AdCreative + swap (message/headline/description/CTA/link). dryRun default true.
        Exige Page. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdCreativeCopyBody"
      responses:
        "200":
          description: Copy atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/ads/{adId}/media:
    post:
      operationId: updateAdMedia
      summary: Atualizar mídia do anúncio
      description: >
        imageUrl ou imageHash via novo AdCreative + swap; preserva copy. dryRun default true.
        Sem video/upload. confirm + confirmTenantId. Nunca inventar URLs.
      x-openai-isConsequential: true
      parameters:
        - name: adId
          in: path
          required: true
          schema:
            type: string
          description: ID do anúncio na Meta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdMediaBody"
      responses:
        "200":
          description: Mídia atualizada ou preview dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/preview:
    post:
      operationId: previewBulkDelete
      summary: Preview exclusão em massa (IDs explícitos)
      description: >
        Valida ownership dos IDs (level campaign|adset|ad), retorna tabela
        nome/status/budget e previewToken (TTL). Sem POST na Graph.
        NUNCA apague por nome — só IDs explícitos (máx. META_GPT_BULK_MAX).
      x-openai-isConsequential: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewBulkDeleteBody"
      responses:
        "200":
          description: Preview + previewToken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/bulk-delete/execute:
    post:
      operationId: executeBulkDelete
      summary: Executar exclusão em massa (após preview)
      description: >
        Exige previewToken recente + confirm + confirmTenantId + confirmDelete=true
        + dryRun=false. Processa sequencialmente (succeeded/failed).
        Default dryRun=true (sem mutação). Preferir deleteMode=DELETED.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteBulkDeleteBody"
      responses:
        "200":
          description: Resultado parcial ou total da exclusão / dry-run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/insights:
    post:
      operationId: getInsights
      summary: Consultar insights Meta
      description: >
        Métricas (impressions, spend, CTR, etc.) por nível account|campaign|adset|ad
        e período (datePreset ou custom). Sempre informe tenantId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsBody"
      responses:
        "200":
          description: Métricas (insights)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

  /api/gpt/meta/invoke:
    post:
      operationId: invokeMetaTool
      summary: Invocação genérica (alternativa)
      description: >
        Invoca uma tool pelo nome (alternativa tipada). Prefira as rotas REST acima
        no Custom GPT. Tools sem rota dedicada (capabilities, upload, catalogs,
        product sets, experiments) usam este endpoint — ver enum `tool`.
        Limite ChatGPT: ≤30 operations nesta Action; overflow fica no invoke.
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeBody"
      responses:
        "200":
          description: Resultado da tool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkToolResponse"
        "401":
          description: Não autorizado — API key ausente ou inválida
        "400":
          description: Requisição inválida — erro de validação ou da ferramenta

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: BLIMBER_MCP_API_KEY no GPT (Authentication → API Key → Bearer).

  schemas:
    OkToolResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tool:
          type: string
        data:
          type: object
          description: Payload tipado da tool (estrutura varia por operação).
    AdvantageFeatureEnroll:
      type: object
      required: [enrollStatus]
      properties:
        enrollStatus:
          type: string
          enum: [OPT_IN, OPT_OUT]
    ErrorToolResponse:
      type: object
      description: >
        Erro tipado. Em META_GRAPH_ERROR, details inclui code, error_subcode,
        error_user_title, error_user_msg, fbtrace_id e request_payload (sem tokens).
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            statusCode:
              type: integer
            details:
              type: object
              description: Campos Graph + request_payload sanitizado em writes.
    ToolsCatalogResponse:
      type: object
      properties:
        server:
          type: string
        version:
          type: string
        primary:
          type: string
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              arguments:
                type: array
                items:
                  type: string
    InsightsBody:
      type: object
      required: [tenantId]
      properties:
        tenantId:
          type: string
          format: uuid
          description: UUID do tenant.
        adAccountId:
          type: string
          description: Conta de anúncio opcional (sem prefixo act_).
        level:
          type: string
          enum: [account, campaign, adset, ad]
          default: campaign
        datePreset:
          type: string
          enum: [today, yesterday, last_7d, last_14d, last_30d, last_90d, custom]
          default: last_7d
        dateStart:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        dateEnd:
          type: string
          description: YYYY-MM-DD se datePreset=custom.
        metrics:
          type: array
          items:
            type: string
          description: Campos Graph opcionais; o padrão inclui spend, clicks e impressions.
        objectId:
          type: string
          description: ID de campanha, conjunto ou anúncio para insights desse nó.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    UpdateCampaignStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false nesta ação (retrocompatível).
    UpdateAdsetStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false (espelho da campanha).
    UpdateAdStatusBody:
      type: object
      required: [tenantId, status, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        status:
          type: string
          enum: [ACTIVE, PAUSED]
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        dryRun:
          type: boolean
          description: >
            Se true, valida ownership e retorna preview sem POST na Graph.
            Default false (espelho da campanha).
    CreateCampaignBody:
      type: object
      required: [tenantId, name, objective, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome da campanha.
        objective:
          type: string
          enum:
            - OUTCOME_AWARENESS
            - OUTCOME_ENGAGEMENT
            - OUTCOME_LEADS
            - OUTCOME_SALES
            - OUTCOME_TRAFFIC
            - OUTCOME_APP_PROMOTION
          description: Objetivos Outcome_* (legados rejeitados).
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (XOR com dailyBudget).
        specialAdCategories:
          type: array
          items:
            type: string
            enum:
              - CREDIT
              - EMPLOYMENT
              - HOUSING
              - ISSUES_ELECTIONS_POLITICS
              - ONLINE_GAMBLING_AND_GAMING
              - FINANCIAL_PRODUCTS_SERVICES
          description: Categorias especiais Meta (vazio = nenhuma).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    MetaCustomTargeting:
      type: object
      description: >
        Subconjunto validado do targeting Graph. Exige geo_locations com
        countries e/ou cities e/ou regions. interests/behaviors no topo
        viram flexible_spec. Não envie junto com targetingTemplate.
      properties:
        age_min:
          type: integer
          minimum: 13
          maximum: 65
        age_max:
          type: integer
          minimum: 13
          maximum: 65
        genders:
          type: array
          items:
            type: integer
            enum: [1, 2]
          description: 1=masculino, 2=feminino. Omitir = todos.
          minItems: 1
          maxItems: 2
        geo_locations:
          type: object
          properties:
            countries:
              type: array
              items:
                type: string
                minLength: 2
                maxLength: 2
              description: ISO country codes (ex. BR).
            cities:
              type: array
              items:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                  name:
                    type: string
                  radius:
                    type: number
                  distance_unit:
                    type: string
                    enum: [kilometer, mile]
            regions:
              type: array
              items:
                type: object
                required: [key]
                properties:
                  key:
                    type: string
                  name:
                    type: string
            location_types:
              type: array
              items:
                type: string
                enum: [home, recent, travel_in]
        locales:
          type: array
          items:
            type: integer
        interests:
          type: array
          description: Atalho → flexible_spec[0].interests (IDs Meta).
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              name:
                type: string
        behaviors:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              name:
                type: string
        flexible_spec:
          type: array
          items:
            type: object
            properties:
              interests:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
              behaviors:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
        exclusions:
          type: object
          properties:
            interests:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  name: { type: string }
            behaviors:
              type: array
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string }
                  name: { type: string }
        custom_audiences:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
        excluded_custom_audiences:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
        publisher_platforms:
          type: array
          items:
            type: string
            enum: [facebook, instagram, audience_network, messenger]
        facebook_positions:
          type: array
          items:
            type: string
        instagram_positions:
          type: array
          items:
            type: string
        device_platforms:
          type: array
          items:
            type: string
            enum: [mobile, desktop]
    CreateAdsetBody:
      type: object
      required:
        - tenantId
        - campaignId
        - name
        - billingEvent
        - optimizationGoal
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        campaignId:
          type: string
          description: ID da campanha (mesma ad account do tenant).
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome do adset.
        targetingTemplate:
          type: string
          enum: [BR_18_65, BR_25_54, BR_18_34, BR_35_65]
          description: Preset geo+idade. XOR com targeting — envie um OU outro.
        targeting:
          $ref: "#/components/schemas/MetaCustomTargeting"
        advantageAudience:
          type: integer
          enum: [0, 1]
          description: >
            targeting_automation.advantage_audience (Graph v23+). Default 0 (BAU com idade/geo).
            Use 1 só para optar em Advantage+ audience.
        billingEvent:
          type: string
          enum: [IMPRESSIONS, LINK_CLICKS]
          description: Cobrança. CTWA (WHATSAPP) exige IMPRESSIONS.
        optimizationGoal:
          type: string
          enum:
            - REACH
            - IMPRESSIONS
            - LINK_CLICKS
            - LANDING_PAGE_VIEWS
            - OFFSITE_CONVERSIONS
            - LEAD_GENERATION
            - QUALITY_LEAD
            - CONVERSATIONS
            - THRUPLAY
            - POST_ENGAGEMENT
          description: Otimização. CTWA tipicamente CONVERSATIONS.
        destinationType:
          type: string
          enum: [WEBSITE, WHATSAPP, MESSENGER, INSTAGRAM_DIRECT]
          default: WEBSITE
          description: Destino do adset. Destinos de mensagem ≠ objective de campanha.
        isDynamicCreative:
          type: boolean
          description: >
            Se true, POST com is_dynamic_creative=true (Dynamic Creative legado).
            Só WEBSITE. Ads devem usar creativeType=DYNAMIC_CREATIVE_LEGACY + assetFeed.
        campaignObjective:
          type: string
          enum:
            - OUTCOME_AWARENESS
            - OUTCOME_ENGAGEMENT
            - OUTCOME_LEADS
            - OUTCOME_SALES
            - OUTCOME_TRAFFIC
            - OUTCOME_APP_PROMOTION
          description: Objective da campanha p/ validar CTWA no dry-run.
        whatsappPhoneNumber:
          type: string
          description: Opcional. Telefone E.164 no promoted_object CTWA.
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        dailyBudget:
          type: integer
          minimum: 1
          description: Orçamento diário em centavos (XOR com lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Orçamento vitalício em centavos (exige endTime).
        startTime:
          type: string
          description: Início ISO-8601 opcional.
        endTime:
          type: string
          description: Fim ISO-8601 (obrigatório com lifetimeBudget).
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    CreateAdBody:
      type: object
      required:
        - tenantId
        - adsetId
        - name
        - confirmTenantId
        - confirm
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
          description: Conta sem act_. Usa a da integração se omitido.
        adsetId:
          type: string
          description: ID do adset (mesma ad account do tenant).
        name:
          type: string
          minLength: 1
          maxLength: 400
          description: Nome do anúncio.
        creativeId:
          type: string
          description: >
            Reusa AdCreative existente (XOR com creativeType/mídia/copy).
            Ownership validada no execute (mesma ad account).
        creativeType:
          type: string
          enum: [IMAGE, VIDEO, CAROUSEL, DYNAMIC_CREATIVE_LEGACY, CATALOG]
          default: IMAGE
          description: >
            IMAGE|VIDEO|CAROUSEL|DYNAMIC_CREATIVE_LEGACY|CATALOG (ou creativeId XOR).
            Advantage+ = degreesOfFreedomSpec. Mídia flexível Ads Manager = pac_relaxation.
            Flexible Ad Format (creative_asset_groups_spec) não suportado — capability=false.
        destinationType:
          type: string
          enum: [WEBSITE, WHATSAPP, MESSENGER, INSTAGRAM_DIRECT]
          default: WEBSITE
          description: WEBSITE exige linkUrl; WHATSAPP|MESSENGER|INSTAGRAM_DIRECT = Click-to-Message (IMAGE|VIDEO|CAROUSEL).
        linkUrl:
          type: string
          format: uri
          description: URL https de site (IMAGE/VIDEO/CAROUSEL WEBSITE). Rejeita wa.me; nunca inventar.
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Texto principal. Obrigatório IMAGE/VIDEO/CAROUSEL (sem creativeId).
        headline:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        callToAction:
          type: string
          enum:
            - LEARN_MORE
            - SHOP_NOW
            - SIGN_UP
            - SUBSCRIBE
            - CONTACT_US
            - DOWNLOAD
            - GET_OFFER
            - BOOK_NOW
            - BUY_NOW
            - APPLY_NOW
            - GET_QUOTE
            - WHATSAPP_MESSAGE
            - MESSAGE_PAGE
            - INSTAGRAM_MESSAGE
          description: WEBSITE default LEARN_MORE; destinos de mensagem forçam CTA oficial.
        welcomeMessage:
          type: string
          maxLength: 1000
          description: Destinos de mensagem (IMAGE|VIDEO|CAROUSEL) — saudação/autofill (page_welcome_message).
        imageUrl:
          type: string
          format: uri
          description: URL https de imagem (upload SSRF no execute). XOR imageHash. Nunca inventar.
        imageHash:
          type: string
          description: image_hash já na conta (XOR imageUrl).
        videoId:
          type: string
          description: video_id já na biblioteca Meta (VIDEO). XOR videoUrl.
        videoUrl:
          type: string
          format: uri
          description: HTTPS para upload Advideo no execute (SSRF). XOR videoId. dryRun não faz upload.
        childAttachments:
          type: array
          minItems: 2
          maxItems: 10
          description: Obrigatório em CAROUSEL — cards com imageHash|imageUrl|videoId (link só WEBSITE).
          items:
            type: object
            properties:
              link:
                type: string
                format: uri
                description: Só WEBSITE. Omita em destinos de mensagem.
              name:
                type: string
                maxLength: 255
              description:
                type: string
                maxLength: 500
              imageHash:
                type: string
              imageUrl:
                type: string
                format: uri
              videoId:
                type: string
        assetFeed:
          type: object
          description: >
            Obrigatório em DYNAMIC_CREATIVE_LEGACY (asset_feed_spec).
            Adset deve ter is_dynamic_creative=true (createAdset.isDynamicCreative).
          properties:
            bodies:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            titles:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            descriptions:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text:
                    type: string
            images:
              type: array
              items:
                type: object
                required: [hash]
                properties:
                  hash:
                    type: string
            videos:
              type: array
              items:
                type: object
                required: [videoId]
                properties:
                  videoId:
                    type: string
                  thumbnailUrl:
                    type: string
                    format: uri
                  thumbnailHash:
                    type: string
            linkUrls:
              type: array
              minItems: 1
              items:
                type: object
                required: [websiteUrl]
                properties:
                  websiteUrl:
                    type: string
                    format: uri
            callToActionTypes:
              type: array
              minItems: 1
              items:
                type: string
            adFormats:
              type: array
              minItems: 1
              items:
                type: string
                enum: [SINGLE_IMAGE, SINGLE_VIDEO, CAROUSEL, AUTOMATIC_FORMAT]
        degreesOfFreedomSpec:
          type: object
          description: >
            Advantage+ Creative (creative_features_spec). pac_relaxation = Mídia flexível
            no Ads Manager. Não usar com DYNAMIC_CREATIVE_LEGACY. Chaves whitelist:
            pac_relaxation, text_optimizations, image_touchups, enhance_cta, etc.
          properties:
            creativeFeaturesSpec:
              type: object
              description: Map feature → enrollStatus OPT_IN|OPT_OUT.
              properties:
                pac_relaxation:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                text_optimizations:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_touchups:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                enhance_cta:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                adapt_to_placement:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                media_type_automation:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_template:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                inline_comment:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
                image_brightness_and_contrast:
                  $ref: "#/components/schemas/AdvantageFeatureEnroll"
        catalogId:
          type: string
          description: CATALOG — product catalog id (via meta_list_catalogs / invoke).
        productSetId:
          type: string
          description: CATALOG — product_set_id (via meta_list_product_sets / invoke).
        creativeName:
          type: string
          maxLength: 400
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          default: PAUSED
          description: Default PAUSED. ACTIVE exige confirmActive=true.
        confirmTenantId:
          type: string
          format: uuid
          description: Deve ser idêntico a tenantId.
        confirm:
          type: boolean
          enum: [true]
          description: Deve ser true para aplicar a mutação.
        confirmActive:
          type: boolean
          enum: [true]
          description: Obrigatório se status=ACTIVE.
        dryRun:
          type: boolean
          description: >
            Se true (default), retorna preview sem POST. Envie false para criar.
    UpdateAdsetBudgetBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        dailyBudget:
          type: integer
          minimum: 1
          description: Novo daily em centavos (XOR lifetimeBudget).
        lifetimeBudget:
          type: integer
          minimum: 1
          description: Novo lifetime em centavos (XOR dailyBudget).
        endTime:
          type: string
          description: ISO-8601; obrigatório se lifetime sem end_time atual.
        confirmBudgetIncrease:
          type: boolean
          enum: [true]
          description: Se aumento % > teto env.
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdsetTargetingBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        targetingTemplate:
          type: string
          enum: [BR_18_65, BR_25_54, BR_18_34, BR_35_65]
          description: Preset BR_*. XOR com targeting.
        targeting:
          $ref: "#/components/schemas/MetaCustomTargeting"
        advantageAudience:
          type: integer
          enum: [0, 1]
          description: >
            targeting_automation.advantage_audience (Graph v23+). Default 0.
            Use 1 para Advantage+ audience.
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdCreativeCopyBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        message:
          type: string
          maxLength: 2000
        headline:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 500
        callToAction:
          type: string
          enum:
            - LEARN_MORE
            - SHOP_NOW
            - SIGN_UP
            - SUBSCRIBE
            - CONTACT_US
            - DOWNLOAD
            - GET_OFFER
            - BOOK_NOW
            - BUY_NOW
            - APPLY_NOW
            - GET_QUOTE
            - WHATSAPP_MESSAGE
        linkUrl:
          type: string
          format: uri
        creativeName:
          type: string
          maxLength: 400
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    UpdateAdMediaBody:
      type: object
      required: [tenantId, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        imageUrl:
          type: string
          format: uri
          description: HTTPS (XOR imageHash). Nunca inventar.
        imageHash:
          type: string
        creativeName:
          type: string
          maxLength: 400
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true — preview sem POST.
    PreviewBulkDeleteBody:
      type: object
      required: [tenantId, level, ids]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        level:
          type: string
          enum: [campaign, adset, ad]
        ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: IDs Meta explícitos (nunca por nome). Máx. META_GPT_BULK_MAX.
        deleteMode:
          type: string
          enum: [DELETED, ARCHIVED]
          default: DELETED
    ExecuteBulkDeleteBody:
      type: object
      required: [tenantId, level, ids, previewToken, confirmTenantId, confirm, confirmDelete]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        level:
          type: string
          enum: [campaign, adset, ad]
        ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: Mesmos IDs do preview (deletableIds).
        previewToken:
          type: string
          description: Token de meta_preview_bulk_delete (TTL).
        deleteMode:
          type: string
          enum: [DELETED, ARCHIVED]
          default: DELETED
        confirmDelete:
          type: boolean
          enum: [true]
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true. Execute real só com false após confirmação.
    CreateCustomAudienceBody:
      type: object
      required: [tenantId, sourceType, confirmTenantId, confirm]
      properties:
        tenantId:
          type: string
          format: uuid
        adAccountId:
          type: string
        name:
          type: string
          description: Opcional. Sem nome, gera padrão (ex. IG | Engajamento | 365d).
        description:
          type: string
        sourceType:
          type: string
          enum: [INSTAGRAM, FACEBOOK_PAGE, WEBSITE, LEAD_FORM, CUSTOMER_LIST, LOOKALIKE]
        event:
          type: string
          description: >
            INSTAGRAM ALL|FOLLOWERS|PROFILE_VISIT|ENGAGED|MESSAGED|SAVED.
            PAGE FOLLOWERS|ENGAGED|PAGE_VISIT|POST_ENGAGEMENT|CTA_CLICK|MESSAGED|SAVED.
            WEBSITE ALL_VISITORS|VISITORS_BY_URL|ViewContent|Lead|AddToCart|InitiateCheckout|Purchase|CompleteRegistration.
            LEAD_FORM OPENED|DROPOFF|SUBMITTED.
        retentionDays:
          type: integer
          description: Dias (convertido a segundos). Seguidores = 0.
        instagramAccountId:
          type: string
        pageId:
          type: string
        pixelId:
          type: string
        leadFormId:
          type: string
        urlContains:
          type: string
        originAudienceId:
          type: string
          description: Seed do lookalike (não pode ser outro LAL).
        lookalikeRatio:
          type: number
          description: 0.01 a 0.20 (1% a 20%).
        lookalikeCountry:
          type: string
          description: ISO-2 (default BR).
        prefill:
          type: boolean
        duplicateStrategy:
          type: string
          enum: [ERROR, RETURN_EXISTING, CREATE_ANYWAY]
          default: ERROR
        confirmTenantId:
          type: string
          format: uuid
        confirm:
          type: boolean
          enum: [true]
        dryRun:
          type: boolean
          description: Default true. Criação real exige false.
    InvokeBody:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          type: string
          description: >
            Nome canônico da tool MCP/HTTP. Tools sem rota REST dedicada
            (capabilities, upload, catalogs, experiments, audience update/delete)
